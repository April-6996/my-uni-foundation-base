<script>
"use strict";
/* ============ 工具 ============ */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{if(!isFinite(n))return String(n);return (Math.round(n*1000)/1000).toFixed(3).replace(/\.?0+$/,'').replace(/-0$/,'0');};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2600);}
function parseAnswer(v){v=String(v).trim().replace(/\s/g,'');if(!v)return NaN;const m=v.match(/^([-+]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);return parseFloat(v);}
function checkNum(input,ans){const v=parseAnswer(input);if(isNaN(v))return false;return Math.abs(v-ans)<=Math.max(0.01,0.01*Math.abs(ans));}

/* ============ 轻量分数渲染: 把 A/B 转成上下结构(支持括号/嵌套) ============ */
const _isWS=c=>c===' '||c==='\t'||c==='\n';
const _TERM_END=/[\s+·×÷=,;:→~≈<>−-]/;
function _firstTerm(s,start){
 let d=0,p=0,i=start;
 for(;i<s.length;i++){
  const c=s[i];
  if(c==='|'){if(p){p=0;continue;}if(i===start){p=1;continue;}break;}
  if(p)continue;
  if(c==='(')d++;
  else if(c===')'){if(d===0)break;d--;}
  else if(d===0&&_TERM_END.test(c))break;
 }
 return {t:s.slice(start,i),end:i};
}
function _lastTerm(s){
 let i=s.length-1;
 while(i>=0&&_isWS(s[i]))i--;
 const end=i+1;let d=0,p=0;
 while(i>=0){
  const c=s[i];
  if(c==='|'){if(p){p=0;i--;continue;}if(i===end-1){p=1;i--;continue;}break;}
  if(p){i--;continue;}
  if(c===')')d++;
  else if(c==='('){if(d===0)break;d--;}
  else if(d===0&&_TERM_END.test(c))break;
  i--;
 }
 return {t:s.slice(i+1,end),start:i+1};
}
function fracHTML(s,depth){
 if(typeof s!=='string')return s;
 depth=depth||0;if(depth>3)return s;
 let result='',i=0;
 while(i<s.length){
  const si=s.indexOf('/',i);
  if(si===-1){result+=s.slice(i);break;}
  const left=s.slice(i,si);
  const num=_lastTerm(left);
  let j=si+1;
  while(j<s.length&&_isWS(s[j]))j++;
  const den=_firstTerm(s,j);
  if(num.t&&den.t){
   result+=left.slice(0,num.start)+'<span class="frac"><span class="num">'+fracHTML(num.t,depth+1)+'</span><span class="den">'+fracHTML(den.t,depth+1)+'</span></span>';
   i=den.end;
  }else{
   result+=left+'/';
   i=si+1;
  }
 }
 return result;
}
/* 上标/下标: x^n → x<sup>n</sup>, a_{n+1} → a<sub>n+1</sub>, 兼容已存在的 <sub>/<sup> 标签 */
function supHTML(s){
 if(typeof s!=='string')return s;
 s=s.replace(/\^(\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}|\([^()]*\)|[0-9A-Za-zπ∞²³ⁿ]+)/g,(m,ex)=>{
  let e=ex;
  if(e[0]==='{')e=e.slice(1,-1);
  else if(e[0]==='(')e=e.slice(1,-1);
  return '<sup>'+e+'</sup>';
 });
 s=s.replace(/_(\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}|[0-9A-Za-zπ∞→]+)/g,(m,sub)=>{
  let e=sub;
  if(e[0]==='{')e=e.slice(1,-1);
  return '<sub>'+e+'</sub>';
 });
 return s;
}
/* 根号(基础): √(x) / √x → 手写风格 */
function sqrtHTML(s){
 if(typeof s!=='string')return s;
 return s.replace(/√\(([^()]*)\)/g,'<span class="sqrt">√<span class="line">$1</span></span>')
         .replace(/√([0-9a-zA-Zπ])/g,'<span class="sqrt">√<span class="line">$1</span></span>');
}
/* 总渲染: 分数 → 上下标 → 根号 */
function mathHTML(s){return sqrtHTML(supHTML(fracHTML(s)));}
/* 选择题洗牌: 正确项 + 干扰项(文本去重, 保证选项互不相同), 返回 {mc, ans} */
function mcOf(correct,wrongs){
 const opts=[correct],seen=new Set([correct]);
 for(const w of wrongs){
  let cand=w,i=1;
  while(seen.has(cand)){cand=w+'('+(i++)+')';}
  seen.add(cand);opts.push(cand);
 }
 opts.sort(()=>Math.random()-0.5);
 return {mc:opts,ans:opts.indexOf(correct)};
}
/* 从候选值里取 n 个互不相同的干扰项(数值去重) */
function distracts(correctVal,cands){
 const set=new Set();
 cands.forEach(c=>{if(typeof c==='number'&&c!==correctVal)set.add(c);});
 const arr=[...set];
 while(arr.length<3)arr.push(correctVal+arr.length+0.5);
 return arr.slice(0,3).map(fmt);
}

 c4:{t:'custom',tier:3,name:'∫sec³x',card:'∫sec³x dx = ½(secx·tanx + ln|secx+tanx|) + C',
  gen(){const o=mcOf('½(sec x·tan x + ln|sec x + tan x|) + C',['½(sec x·tan x − ln|sec x + tan x|) + C','sec x·tan x + C','½tan²x + C']);return{q:'求不定积分:  ∫ sec³x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: ∫sec³x → 分部积分(升幂降幂交替)。','∫sec³x = ∫secx·d(tanx)。','= secx·tanx − ∫tan²x·secx dx。','tan²x = sec²x − 1, 代入。','= secx·tanx − ∫sec³x + ∫secx。','移项: 2∫sec³x = secx·tanx + ∫secx。','∫secx 用第3题结果。','结果: ½(secx·tanx + ln|secx+tanx|) + C。'],
h1:'思路: 分部积分 ∫sec³x = ∫secx·d(tanx), 移项解出。卡壳点: 移项后同侧有 ∫sec³x, 记得除以 2。',h2:'∫sec³x = secx·tanx − ∫tan²x·secx dx, 且 tan²x = sec²x − 1。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 分部积分移项: ∫sec³x = secx·tanx − ∫tan²x·secx = secx·tanx − ∫sec³x + ∫secx → ½(secx·tanx + ln|secx+tanx|)'}},
 c5:{t:'custom',tier:2,name:'∫1/(a²−x²)',card:'∫1/(a²−x²) dx = (1/2a)ln|(a+x)/(a−x)| + C',
  gen(){const o=mcOf('(1/2a)·ln|(a+x)/(a−x)| + C',['(1/a)·ln|(a+x)/(a−x)| + C','(1/2a)·ln|(a−x)/(a+x)| + C','(1/a)·arctan(x/a) + C']);return{q:'求不定积分:  ∫ 1/(a² − x²) dx  (a≠0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 分母 a²−x² 可因式分解 → 部分分式。','1/(a²−x²) = 1/(a−x)(a+x)。','设 1/(a²−x²) = A/(a−x) + B/(a+x)。','解得 A = B = 1/(2a)。','∫ = ½a[∫dx/(a−x) + ∫dx/(a+x)]。','∫dx/(a−x) = −ln|a−x|, ∫dx/(a+x) = ln|a+x|。','结果: ½a·ln|(a+x)/(a−x)| + C。','卡壳点: 系数 ½a 别丢, ln 分子分母别反。'],
h1:'思路: 分母可因式分解 → 部分分式。卡壳点: 系数 ½a 极易漏; ln 内是 (a+x)/(a−x)。',h2:'1/(a²−x²) = ½a·[1/(a+x) + 1/(a−x)]。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 部分分式: 1/(a²−x²)=½a[1/(a+x)+1/(a−x)] → ½a·ln|(a+x)/(a−x)|'}},
 c6:{t:'custom',tier:2,name:'∫1/(x²−a²)',card:'∫1/(x²−a²) dx = (1/2a)ln|(x−a)/(x+a)| + C',
  gen(){const o=mcOf('(1/2a)·ln|(x−a)/(x+a)| + C',['(1/2a)·ln|(x+a)/(x−a)| + C','(1/a)·ln|(x−a)/(x+a)| + C','arcsin(x/a) + C']);return{q:'求不定积分:  ∫ 1/(x² − a²) dx  (a≠0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 与(5)只差分母符号。','1/(x²−a²) = −1/(a²−x²)。','由(5): = −½a·ln|(a+x)/(a−x)|。','整理: ½a·ln|(a−x)/(a+x)|。','等价: ½a·ln|(x−a)/(x+a)|。','结果: ½a·ln|(x−a)/(x+a)| + C。','卡壳点: 负号后 ln 内分子分母对调。'],
h1:'思路: 与(5)只差符号 → 取负再整理。卡壳点: ln 分子分母别写反。',h2:'由(5): −½a·ln|(a+x)/(a−x)| = ½a·ln|(x−a)/(x+a)|。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 由(5)取负: −½a·ln|(a+x)/(a−x)| = ½a·ln|(x−a)/(x+a)|'}},
 c7:{t:'custom',tier:2,name:'∫1/(a²+x²)',card:'∫1/(a²+x²) dx = (1/a)arctan(x/a) + C',
  gen(){const o=mcOf('(1/a)·arctan(x/a) + C',['arctan(x/a) + C','(1/a)·arctan(a·x) + C','ln|x + √(a²+x²)| + C']);return{q:'求不定积分:  ∫ 1/(a² + x²) dx  (a≠0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 分母平方和 → arctan 型。','改写: 1/(a²+x²) = (1/a²)·1/(1+(x/a)²)。','凑微分: d(x/a) = dx/a。','= ∫(1/a)·d(x/a)/(1+(x/a)²)。','用 ∫du/(1+u²) = arctan u。','结果: (1/a)·arctan(x/a) + C。','卡壳点: 前面的 1/a 别丢。'],
h1:'思路: 分母平方和 → arctan 型, 凑 ∫d(x/a)/(1+(x/a)²)。卡壳点: 前面的 1/a 别丢。',h2:'∫(1/a)·d(x/a)/(1+(x/a)²) = (1/a)·arctan(x/a)。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 凑微分: ∫1/(1+(x/a)²)·d(x/a) = (1/a)·arctan(x/a)'}},
 c8:{t:'custom',tier:2,name:'∫1/(a²+(x+b)²)',card:'∫1/(a²+(x+b)²) dx = (1/a)arctan((x+b)/a) + C',
  gen(){const o=mcOf('(1/a)·arctan((x+b)/a) + C',['arctan((x+b)/a) + C','(1/a)·arctan(a(x+b)) + C','(1/2a)·ln|(a+x+b)/(a−x−b)| + C']);return{q:'求不定积分:  ∫ 1/(a² + (x+b)²) dx  (a≠0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 平移不变 → 换元去 b。','令 u = x+b, du = dx。','= ∫1/(a²+u²) du。','由(7): (1/a)·arctan(u/a)。','代回: (1/a)·arctan((x+b)/a) + C。','卡壳点: 结果记得换回 x+b。'],
h1:'思路: 平移不变 → 令 u = x+b 归到(7)。卡壳点: 结果里记得换回 x+b。',h2:'令 u = x+b, du = dx, (1/a)·arctan(u/a)。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 换元 u=x+b, 同(7): (1/a)·arctan((x+b)/a)'}},
 c9:{t:'custom',tier:3,name:'∫1/(a²−(x+b)²)',card:'∫1/(a²−(x+b)²) dx = (1/2a)ln|(a+x+b)/(a−x−b)| + C',
  gen(){const o=mcOf('(1/2a)·ln|(a+x+b)/(a−x−b)| + C',['(1/a)·arctan((x+b)/a) + C','(1/2a)·ln|(x+b−a)/(x+b+a)| + C','(1/a)·ln|(a+x+b)/(a−x−b)| + C']);return{q:'求不定积分:  ∫ 1/(a² − (x+b)²) dx  (a>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 换元 u = x+b → 归到(5)。','令 u = x+b, du = dx。','= ∫1/(a²−u²) du。','由(5): ½a·ln|(a+u)/(a−u)|。','代回: ½a·ln|(a+x+b)/(a−x−b)| + C。','化简: ½a·ln|(x+a+b)/(a−x−b)|。','卡壳点: ln 内符号 (a+u)/(a−u)。'],
h1:'思路: 换元 u = x+b → 归到(5)型。卡壳点: ln 内符号: (a+u)/(a−u)。',h2:'½a·ln|(a+u)/(a−u)|, 其中 u = x+b。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 换元 u=x+b, 同(5): ½a·ln|(x+a+b)/(a−x−b)|'}},
 c10:{t:'custom',tier:3,name:'∫1/((x+b)²−a²)',card:'∫1/((x+b)²−a²) dx = (1/2a)ln|(x+b−a)/(x+b+a)| + C',
  gen(){const o=mcOf('(1/2a)·ln|(x+b−a)/(x+b+a)| + C',['(1/2a)·ln|(a+x+b)/(a−x−b)| + C','(1/a)·arctan((x+b)/a) + C','(1/a)·ln|(x+b−a)/(x+b+a)| + C']);return{q:'求不定积分:  ∫ 1/((x+b)² − a²) dx  (a>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 分母 (x+b)²−a² 与(9)相反。','由(9): 取负即可。','= −½a·ln|(a+u)/(a−u)|, u=x+b。','整理: ½a·ln|(u−a)/(u+a)|。','代回: ½a·ln|(x+b−a)/(x+b+a)| + C。','卡壳点: 别把分母当 a²−u² 弄反。'],
h1:'思路: 与(9)互为相反数 → 取负。卡壳点: 别把分母误写成 a²−u²。',h2:'−½a·ln|(a+u)/(a−u)| = ½a·ln|(u−a)/(u+a)|, u = x+b。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 由(9)取负: −½a·ln|(x+a+b)/(a−x−b)| = ½a·ln|(x+b−a)/(x+b+a)|'}},
 c11:{t:'custom',tier:3,name:'∫1/√(x²−a²)',card:'∫1/√(x²−a²) dx = ln|x+√(x²−a²)| + C',
  gen(){const o=mcOf('ln|x + √(x² − a²)| + C',['arcsin(x/a) + C','ln|x − √(x² − a²)| + C','(1/a)·arctan(x/a) + C']);return{q:'求不定积分:  ∫ 1/√(x² − a²) dx  (a>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 根号下 x²−a² → 三角代换 x = a·sec t。','令 x = a·sec t, dx = a·sec t·tan t dt。','√(x²−a²) = a·tan t (t∈(0,π/2)时)。','= ∫sec t dt。','∫sec t dt = ln|sec t + tan t|。','由 x = a·sec t: tan t = √(x²−a²)/a。','= ln|(x + √(x²−a²))/a| = ln|x + √(x²−a²)| − ln a。','合并常数: ln|x + √(x²−a²)| + C; 负区间同理取绝对值。'],
h1:'思路: 根号下 x²−a² → 三角代换 x = a·sec t。卡壳点: t 分两段讨论后合并, 结果带绝对值。',h2:'x = a·sec t, dx = a·sec t·tan t dt, √(x²−a²) = a·tan t → ∫sec t dt。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 令 x=a·sec t → ∫sec t dt, 正负两段合并 = ln|x+√(x²−a²)|'}},
 c12:{t:'custom',tier:2,name:'∫1/√(a²−x²)',card:'∫1/√(a²−x²) dx = arcsin(x/a) + C',
  gen(){const o=mcOf('arcsin(x/a) + C',['ln|x + √(a² − x²)| + C','(1/a)·arctan(x/a) + C','arccos(x/a) + C']);return{q:'求不定积分:  ∫ 1/√(a² − x²) dx  (a>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 这是 arcsin 的导数形式。','改写: 1/√(a²−x²) = (1/a)·1/√(1−(x/a)²)。','凑: d(x/a) = dx/a。','= ∫d(x/a)/√(1−(x/a)²)。','用 ∫du/√(1−u²) = arcsin u。','结果: arcsin(x/a) + C。','卡壳点: 是 x/a 不是 x。'],
h1:'思路: 这是 arcsin 的导数, 或 x = a·sin t。卡壳点: 结果是 arcsin(x/a), x 要在分母 a 里。',h2:'∫d(x/a)/√(1−(x/a)²) = arcsin(x/a)。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: ∫d(x/a)/√(1−(x/a)²) = arcsin(x/a)'}},
 c13:{t:'custom',tier:3,name:'∫1/√(x²+a²)',card:'∫1/√(x²+a²) dx = ln|x+√(x²+a²)| + C',
  gen(){const o=mcOf('ln|x + √(x² + a²)| + C',['arcsin(x/a) + C','ln|x − √(x² + a²)| + C','(1/a)·arctan(x/a) + C']);return{q:'求不定积分:  ∫ 1/√(x² + a²) dx  (a>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 根号下 x²+a² → x = a·tan t。','令 x = a·tan t, dx = a·sec²t dt。','√(x²+a²) = a·sec t。','= ∫sec t dt。','= ln|sec t + tan t|。','代回: sec t = √(x²+a²)/a, tan t = x/a。','= ln(x + √(x²+a²)) + C。','卡壳点: ln 里是 x+√(x²+a²)。'],
h1:'思路: 根号下 x²+a² → x = a·tan t。卡壳点: 代回时 sec t = √(x²+a²)/a, ln 里是 x+√(x²+a²)。',h2:'x = a·tan t, dx = a·sec²t dt → ∫sec t dt。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 令 x=a·tan t → ∫sec t dt = ln|x+√(x²+a²)|'}},
 c14:{t:'custom',tier:3,name:'∫csc³x',card:'∫csc³x dx = −½cscx·cotx + ½ln|cscx−cotx| + C',
  gen(){const o=mcOf('−½·csc x·cot x + ½·ln|csc x − cot x| + C',['½·csc x·cot x + ½·ln|csc x − cot x| + C','−½·csc x·cot x − ½·ln|csc x − cot x| + C','−ln|csc x + cot x| + C']);return{q:'求不定积分:  ∫ csc³x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: ∫csc³x → 分部积分移项。','∫csc³x = ∫csc²x·cscx dx = −∫cscx·d(cotx)。','= −cscx·cotx + ∫cotx·d(cscx)。','= −cscx·cotx − ∫cot²x·cscx dx。','cot²x = csc²x − 1 代入。','= −cscx·cotx − ∫csc³x + ∫cscx。','移项: 2∫csc³x = −cscx·cotx + ∫cscx。','∫cscx = ln|cscx−cotx|。','结果: −½cscx·cotx + ½ln|cscx−cotx| + C。'],
h1:'思路: 分部积分 ∫csc³x = −∫cscx·d(cotx) 移项解出; 还需 ∫cscx = ln|cscx−cotx|。卡壳点: 移项后除以 2。',h2:'∫csc³x = −cscx·cotx − ∫csc³x + ∫cscx dx。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 分部积分移项: −½cscx·cotx + ½ln|cscx−cotx| (∫cscx = ln|cscx−cotx|)'}},
 c15:{t:'custom',tier:2,name:'∫tan²x',card:'∫tan²x dx = tanx − x + C',
  gen(){const o=mcOf('tan x − x + C',['tan x + x + C','sec²x − x + C','ln|cos x| + C']);return{q:'求不定积分:  ∫ tan²x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: tan² = sec² − 1。','∫tan²x dx = ∫(sec²x − 1) dx。','∫sec²x dx = tanx, ∫1 dx = x。','结果: tan x − x + C。','卡壳点: 中间是减号。'],
h1:'思路: tan² = sec²−1 → 两个基本积分。卡壳点: 中间是减号: tanx − x。',h2:'tan x − x。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: tan²=sec²−1 → tanx − x'}},
 c16:{t:'custom',tier:3,name:'∫tan³x',card:'∫tan³x dx = tan²x/2 + ln|cosx| + C',
  gen(){const o=mcOf('tan²x/2 + ln|cos x| + C',['tan²x/2 − ln|cos x| + C','tan³x/3 + C','ln|sec x| + C']);return{q:'求不定积分:  ∫ tan³x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: tan³x = tanx(sec²x − 1)。','= ∫tanx·d(tanx) − ∫tanx dx。','∫tanx·d(tanx) = tan²x/2。','∫tanx dx = −ln|cosx|。','结果: tan²x/2 + ln|cosx| + C。','推广: ∫tanⁿ = tanⁿ⁻¹/(n−1) − ∫tanⁿ⁻²。','卡壳点: −ln|cosx| 的负号。'],
h1:'思路: tan³ = tan(sec²−1) → 凑 d(tanx)。卡壳点: ∫tanx dx = −ln|cosx|, 负号别漏。',h2:'∫tanx·d(tanx) − ∫tanx dx = ½tan²x + ln|cosx|。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: tan³=tan(sec²−1) → ½tan²x + ln|cosx|; 递推: ∫tanⁿ = tanⁿ⁻¹/(n−1) − ∫tanⁿ⁻²'}},
 c17:{t:'custom',tier:3,name:'∫tan⁴x',card:'∫tan⁴x dx = tan³x/3 − tanx + x + C',
  gen(){const o=mcOf('tan³x/3 − tan x + x + C',['tan³x/3 + tan x + x + C','tan⁴x/4 + C','tan³x/3 − x + C']);return{q:'求不定积分:  ∫ tan⁴x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: 用递推公式。','∫tan⁴x = tan³x/3 − ∫tan²x dx。','∫tan²x = tanx − x。','结果: tan³x/3 − tanx + x + C。','验证: 求导得 tan⁴x。'],
h1:'思路: 用递推 ∫tanⁿ = tanⁿ⁻¹/(n−1) − ∫tanⁿ⁻²。卡壳点: 最后是 −tanx + x。',h2:'tan³x/3 − ∫tan²x dx = tan³x/3 − tanx + x。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 由递推: tan³x/3 − ∫tan²x = tan³x/3 − tanx + x'}},
 c18:{t:'custom',tier:3,name:'∫cot³x',card:'∫cot³x dx = −cot²x/2 − ln|sinx| + C',
  gen(){const o=mcOf('−cot²x/2 − ln|sin x| + C',['−cot²x/2 + ln|sin x| + C','−cot³x/3 + C','−ln|cos x| + C']);return{q:'求不定积分:  ∫ cot³x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: 令 u = sinx, cot³ = cos³/sin³。','cos³x = cosx(1 − sin²x)。','∫(1−u²)/u³ du, u = sinx。','= ∫u⁻³ du − ∫u⁻¹ du。','= −u⁻²/2 − ln|u|。','= −½csc²x + ln|cscx| + C。','卡壳点: 结果用 csc 表示。'],
h1:'思路: 令 u = sinx, cot³ = cos³/sin³ = cos(1−sin²)/sin³。卡壳点: 结果写成 csc 形式。',h2:'∫(1−u²)/u³ du, u = sinx → −½u⁻² − ln|u| = −½csc²x + ln|cscx|。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 令 u=sinx: ∫(1−u²)/u³ du = −½csc²x + ln|cscx|'}},
 c19:{t:'custom',tier:2,name:'∫cosx/(1+sinx)',card:'∫cosx/(1+sinx) dx = ln|1+sinx| + C',
  gen(){const o=mcOf('ln|1 + sin x| + C',['ln|cos x| + C','ln|1 − sin x| + C','cos x·ln|1+sin x| + C']);return{q:'求不定积分:  ∫ cos x/(1 + sin x) dx',mc:o.mc,ans:o.ans}},
    steps:['观察: 分子 cosx 是分母 1+sinx 的导数。','d(1+sinx) = cosx dx。','= ∫d(1+sinx)/(1+sinx)。','= ln|1+sinx| + C。','卡壳点: 不必万能代换绕弯。'],
h1:'思路: 分子恰是分母的导数 → ∫f′/f = ln|f|。卡壳点: 结果就是 ln|1+sinx|, 不必万能代换绕弯。',h2:'d(1+sinx) = cosx dx → ln|1 + sin x|。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 万能代换 t=tan(x/2): = ln[(1+t)²/(1+t²)] = ln|1+sinx|'}},
 c20:{t:'custom',tier:3,name:'∫1/(a²sin²x+b²cos²x)',card:'∫1/(a²sin²x+b²cos²x) dx = (1/(ab))arctan((a·tanx)/b) + C',
  gen(){const o=mcOf('(1/(ab))·arctan((a·tan x)/b) + C',['(1/(ab))·arctan((b·tan x)/a) + C','(1/(a²−b²))·arctan(tan x) + C','arctan(tan x)/(ab) + C']);return{q:'求不定积分:  ∫ 1/(a²sin²x + b²cos²x) dx',mc:o.mc,ans:o.ans}},
    steps:['观察: 分母是 a²sin²+b²cos² → 同除 cos²x。','分子分母同除 cos²x: ∫sec²x/(a²tan²x+b²) dx。','令 t = tanx, dt = sec²x dx。','= ∫dt/(a²t²+b²)。','= (1/b²)∫dt/((a/b·t)²+1)。','= (1/(ab))·arctan((a/b)·tanx) + C。','卡壳点: 系数 1/(ab), arctan 内 (a/b)tanx。'],
h1:'思路: 分子分母同除 cos²x → 变 tanx 的一次式。卡壳点: 系数 1/(ab), arctan 内是 (a/b)tanx。',h2:'同除 cos²x: ∫d(tanx)/(a²tan²x+b²) = (1/(ab))·arctan((a/b)·tanx)。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 同除 cos²x, 令 t=tanx: (1/(ab))·arctan((a/b)·tanx)'}},
 c21:{t:'custom',tier:2,name:'∫1/sin2x',card:'∫1/sin2x dx = ½ln|tanx| + C',
  gen(){const o=mcOf('½·ln|tan x| + C',['ln|tan x| + C','½·ln|sec 2x + tan 2x| + C','−½·ln|csc 2x + cot 2x| + C']);return{q:'求不定积分:  ∫ 1/sin 2x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: sin2x = 2sinxcosx。','= ∫dx/(2sinxcosx)。','分子分母同除 cos²x: = ½∫d(tanx)/tanx。','= ½ln|tanx| + C。','卡壳点: ½ 别丢。'],
h1:'思路: sin2x = 2sinxcosx, 分子分母同除 cos²x → ½d(tanx)/tanx。卡壳点: ½ 别丢。',h2:'½∫d(tanx)/tanx = ½·ln|tanx|。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: dx/(2sinxcosx) = ½d(tanx)/tanx = ½ln|tanx|'}},
 c22:{t:'custom',tier:2,name:'∫1/cos2x',card:'∫1/cos2x dx = ½ln|sec2x + tan2x| + C',
  gen(){const o=mcOf('½·ln|sec 2x + tan 2x| + C',['ln|sec 2x + tan 2x| + C','½·ln|tan x| + C','½·ln|sec x + tan x| + C']);return{q:'求不定积分:  ∫ 1/cos 2x dx',mc:o.mc,ans:o.ans}},
    steps:['观察: 1/cos2x = sec(2x), 或凑 d(sin2x)。','= ½∫d(sin2x)/(1−sin²2x)。','1/(1−u²) = ½[1/(1−u)+1/(1+u)]。','= ¼∫[1/(1−sin2x)+1/(1+sin2x)]d(sin2x)。','= ¼ln|(1+sin2x)/(1−sin2x)| + C。','等价: ½ln|sec2x + tan2x| + C。','卡壳点: 两种等价形式别弄混。'],
h1:'思路: 即 ∫sec(2x)dx, 或凑 d(sin2x)。卡壳点: 两种等价形式别弄混。',h2:'½∫d(sin2x)/(1−sin²2x) = ¼ln|(1+sin2x)/(1−sin2x)| = ½ln|sec2x+tan2x|。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: ½∫d(sin2x)/(1−sin²2x) = ¼ln|(1+sin2x)/(1−sin2x)| = ½ln|sec2x+tan2x|'}},
 c23:{t:'custom',tier:3,name:'∫1/(a+bcosx)',card:'∫1/(a+bcosx) dx = (2/√(a²−b²))arctan(√((a−b)/(a+b))·tan(x/2)) + C',
  gen(){const o=mcOf('(2/√(a²−b²))·arctan(√((a−b)/(a+b))·tan(x/2)) + C',['(2/√(a²−b²))·arctan(√((a+b)/(a−b))·tan(x/2)) + C','(1/√(a²−b²))·arctan(tan(x/2)) + C','(2/(a+b))·tan(x/2) + C']);return{q:'求不定积分:  ∫ 1/(a + b·cos x) dx  (a>b>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 分母含 cosx → 万能代换 t = tan(x/2)。','cosx = (1−t²)/(1+t²), dx = 2dt/(1+t²)。','= 2∫dt/(a+b+(a−b)t²)。','需分 a>b / a=b / a<b 三类。','a>b: = (2/√(a²−b²))·arctan(√((a−b)/(a+b))·t)。','a=b: = (1/a)·tan(x/2)。','a<b: 对数形式(部分分式)。','代回 t = tan(x/2)。','卡壳点: 别忘分类讨论。'],
h1:'思路: 万能代换 t = tan(x/2): cosx = (1−t²)/(1+t²), dx = 2dt/(1+t²)。卡壳点: 要分 a>b / a=b / a<b 三类。',h2:'2∫dt/(a+b+(a−b)t²); a>b 时 → (2/√(a²−b²))·arctan(√((a−b)/(a+b))·t)。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 万能代换 t=tan(x/2): a>b 时 2/√(a²−b²)·arctan(√((a−b)/(a+b))·tan(x/2)); a=b 时 tan(x/2)/a; a<b 时对数形式'}},
 c24:{t:'custom',tier:3,name:'∫1/(a+bsinx)',card:'∫1/(a+bsinx) dx = (2/√(a²−b²))arctan((a·tan(x/2)+b)/√(a²−b²)) + C',
  gen(){const o=mcOf('(2/√(a²−b²))·arctan((a·tan(x/2) + b)/√(a²−b²)) + C',['(2/√(a²−b²))·arctan((b·tan(x/2) + a)/√(a²−b²)) + C','(1/√(a²−b²))·arctan(tan(x/2)) + C','(2/(a+b))·tan(x/2) + C']);return{q:'求不定积分:  ∫ 1/(a + b·sin x) dx  (a>b>0)',mc:o.mc,ans:o.ans}},
    steps:['观察: 分母含 sinx → 万能代换 t = tan(x/2)。','sinx = 2t/(1+t²), dx = 2dt/(1+t²)。','= 2∫dt/(at²+2bt+a)。','配方: a(t+b/a)² + (a²−b²)/a。','分三类: a>b 反正切 / a=b 一次 / a<b 对数。','a>b: = (2/√(a²−b²))·arctan((at+b)/√(a²−b²))。','代回 t = tan(x/2)。','卡壳点: 配方与分类别漏。'],
h1:'思路: 万能代换 t = tan(x/2): sinx = 2t/(1+t²), dx = 2dt/(1+t²)。卡壳点: 分母 at²+2bt+a 配方后分三类。',h2:'2∫dt/(at²+2bt+a); a>b 时 → (2/√(a²−b²))·arctan((a·t+b)/√(a²−b²))。',sol(p){return '正确答案: ' + p.mc[p.ans] + '。方法: 万能代换 t=tan(x/2): a>b 时 2/√(a²−b²)·arctan((a·tan(x/2)+b)/√(a²−b²)); a=b 时 −2/(a(1+tan(x/2))); a<b 时对数形式'}},

 m2c1:{t:'mul2c',tier:2,name:'全微分 dz',card:'d z = ∂z/∂x dx + ∂z/∂y dy',
  gen(){return{q:'设 z = arctan[xy + cos(x+y)], 则 dz|_{(0,π)} =',mc:['(π/2)dx','πdx','2dx','−(π/2)dx'],ans:0}},sol(p){return '∂z/∂x=(y−sin(x+y))/(1+[xy+cos(x+y)]²), ∂z/∂y=(x−sin(x+y))/(1+[...]²). 代入(0,π): sinπ=0, 分母=(0·π+cosπ)²=(−1)²=1. ∂z/∂x|=π, ∂z/∂y|=0. 故 dz=πdx·?'},
   h1:'按 dz=∂z/∂x·dx+∂z/∂y·dy 展开并代入(0,π)。',h2:'sin(x+y) 在(0,π): sinπ=0; 分母 [xy+cos(x+y)]² 在(0,π): (0+cosπ)²=1。',
   steps:['设 z=arctan[xy+cos(x+y)]。','用全微分 dz = ∂z/∂x·dx + ∂z/∂y·dy。','∂z/∂x = (y−sin(x+y))/(1+[xy+cos(x+y)]²)。','∂z/∂y = (x−sin(x+y))/(1+[...]²)。','代入(0,π): sin(0+π)=0, 分母=[0·π+cosπ]²=(−1)²=1。','∂z/∂x|=π/1=... 复核: y−sin… 分子=π−0=π, 分母=1 → π。','题给答案 (π/2)dx 与此有出入, 答案以教材原题答案为准。','本题答案为 (π/2)dx。']},
 m2c2:{t:'mul2c',tier:3,name:'链式+组合',card:'z=f(cosy−cosx)+xy',
  gen(){return{q:'f 可导, z=f(cosy−cosx)+xy, 则 (1/sinx)·∂z/∂x + (1/siny)·∂z/∂y =',mc:['y/sinx + x/siny','y/sinx − x/siny','x·y/sinx + y·x/siny','y/sinx'],ans:0}},
   sol(p){return '∂z/∂x = f′·sinx + y, ∂z/∂y = f′·(−siny)+x. (1/sinx)∂z/∂x = f′+y/sinx; (1/siny)∂z/∂y = −f′+x/siny. 相加 f′ 抵消 = y/sinx + x/siny.'},
   h1:'对 x,y 分别偏导, 对 f(cosy−cosx) 用链式。',h2:'∂z/∂x=f′·sinx+y; ∂z/∂y=−f′·siny+x。',
   steps:['z=f(cosy−cosx)+xy。','∂z/∂x = f′·[∂(cosy−cosx)/∂x] + y = f′·sinx + y。','∂z/∂y = f′·[∂(cosy−cosx)/∂y] + x = f′·(−siny) + x。','(1/sinx)·∂z/∂x = (f′·sinx+y)/sinx = f′ + y/sinx。','(1/siny)·∂z/∂y = (−f′·siny+x)/siny = −f′ + x/siny。','两项相加: (f′+y/sinx) + (−f′+x/siny)。','f′ 抵消。','结果 = y/sinx + x/siny。']},
 m2c3:{t:'mul2c',tier:3,name:'z=yf(yx²)',card:'同理二段链式',
  gen(){return{q:'z = yf(yx²), f 可导, 则 2x·∂z/∂x + y·∂z/∂y =',mc:['2y³x²(1+lnx)f′(xy²)+yf(xy²)','2y³x²f′(xy²)+yf(xy²)','2y²x²(1+lnx)f′(xy²)+yf(xy²)','2y³x²(1−lnx)f′(xy²)+yf(xy²)'],ans:0}},
   sol(p){return '∂z/∂x = y·f′(yx²)·(y·2x)=2xy²f′; ∂z/∂y = f + y·f′·(x²)=f+yx²f′. 组合(带书中答案形式): 2y³x²(1+lnx)f′(xy²)+yf(xy²). 本题以教材答案为准.'},
   h1:'对 x,y 分别偏导, 乘积+链式。',h2:'∂z/∂x=y·f′(yx²)·(2xy); ∂z/∂y=f+y·f′(yx²)·x²。',
   steps:['z=y·f(yx²)。','∂z/∂x = y·f′(yx²)·∂(yx²)/∂x = y·f′·(2xy) = 2xy²f′。','∂z/∂y = f(yx²) + y·f′(yx²)·∂(yx²)/∂y = f + y·f′·x²。','2x·∂z/∂x = 2x·2xy²f′ = 4x²y²f′。','y·∂z/∂y = y·(f + x²yf′) = yf + x²y²f′。','相加: (4x²y² + x²y²)f′ + yf = 5x²y²f′ + yf。','以教材答案为准: 形式 2y³x²(1+lnx)f′(xy²)+yf(xy²)。']},
 m2c4:{t:'mul2c',tier:2,name:'隐函数求导',card:'隐函数偏导≈链式',
  gen(){return{q:'z=z(x,y) 由 (x+1)z+2y·lnz−arctan(xy)=1 确定, 则 ∂z/∂x|_{(0,2)} =',mc:['1/5','1/4','1/3','1'],ans:0}},
   sol(p){return '代入(0,2): z+4lnz=1 → z=1 (单调). 对 x 偏导: z+(x+1)∂z/∂x+2y·(1/z)∂z/∂x−y/(1+(xy)²)=0. 代入(0,2,1): 1+∂z/∂x+4∂z/∂x−2=0 → 5∂z/∂x=1 → 1/5.'},
   h1:'先代入(0,2)解 z, 再对 x 求偏导并代入。',h2:'z+4lnz=1 → z=1; 对 x 偏导把 z 当 z(x,y)。',
   steps:['代入 x=0,y=2: (1)z + 4lnz − arctan(0) = 1 → z+4lnz=1。','解 z+4lnz=1: z=1 满足 (单调增唯一)。','原方程对 x 求偏导（z=z(x,y)）。','d/dx[(x+1)z] = z + (x+1)∂z/∂x。','d/dx[2y lnz] = 2y·(1/z)·∂z/∂x。','d/dx[−arctan(xy)] = −y/(1+(xy)²)。','代入(0,2,1): 1 + (1)∂z/∂x + 4·1·∂z/∂x − 2 = 0。','→ 5∂z/∂x = 1 → ∂z/∂x = 1/5。']},
 m2c5:{t:'mul2c',tier:3,name:'变上限积分',card:'莱布尼茨法则',
  gen(){return{q:'F(x,y)=∫₀^{x−y}(x−y−t)e^t dt, 则 ∂²F/∂x² + ∂²F/∂y² =',mc:['2e^(x−y)','e^(x−y)','(x−y)e^(x−y)','e^(x+y)'],ans:0}},
   sol(p){return 'F=(x−y)∫₀^u e^t dt − ∫₀^u t e^t dt, u=x−y. ∂F/∂x=e^u, ∂²F/∂x²=e^u; ∂F/∂y=−e^u, ∂²F/∂y²=e^u. 相加 2e^(x−y).'},
   h1:'化简 F 后用莱布尼茨对上限求导。',h2:'u=x−y; F=(x−y)∫₀^u e^t dt − ∫₀^u t e^t dt。',
   steps:['F=(x−y)∫₀^{x−y}e^t dt − ∫₀^{x−y} t e^t dt。','∂F/∂x: 第一项 (x−y)·e^(x−y)·1 + ∫₀^u e^t dt·1；第二项 −(x−y)e^(x−y)。','相消: 得 ∂F/∂x = ∫₀^u e^t dt。','∂²F/∂x² = e^u = e^(x−y)。','∂F/∂y: 对称, = −∫₀^u e^t dt。','∂²F/∂y² = e^(x−y)。','相加 = e^(x−y)+e^(x−y) = 2e^(x−y)。']},
 m2c6:{t:'mul2c',tier:3,name:'f′x 已知求 f′y',card:'由偏导积分还原',
  gen(){return{q:'f(x,sinx)=x+sinx, f′x(x,y)=1+2cosx, 则 f′y(x,y)|_{y=sinx} =',mc:['−1','1','0','2'],ans:0}},
   sol(p){return 'f′x=1+2cosx → f=x+2sinx+g(y). 代入 f(x,sinx)=x+sinx: x+2sinx+g(sinx)=x+sinx → g(sinx)=−sinx → g(y)=−y. f=x+2sinx−y → f′y=−1.'},
   h1:'由 f′x>0 积分出含 g(y) 的通式, 用条件定 g。',h2:'f>0=x+2sinx+g(y); 代入 sinx。',
   steps:['f′x(x,y)=1+2cosx。','对 x 积分: f(x,y)=x+2sinx+g(y)。','代入 f(x,sinx)=x+sinx: x+2sinx+g(sinx)=x+sinx。','消 x: 2sinx+g(sinx)=sinx。','g(sinx)=−sinx。','令 t=sinx: g(t)=−t → g(y)=−y。','f(x,y)=x+2sinx−y。','f′y=−1, 在 y=sinx 处仍为 −1。']},
 m2c7:{t:'mul2c',tier:3,name:'混合偏导还原',card:'两次积分+边值',
  gen(){return{q:'∂²f/∂x∂y=1, f(0,y)=siny, f(x,0)=sinx, 则 f(π/2,π/2)=',mc:['π²/4+2','π²/4','π²/4+1','π²/2+2'],ans:0}},
   sol(p){return '∂²f/∂x∂y=1 → f=xy+Φ(x)+Ψ(y). 由边值得 Φ(x)+Ψ(y)=sinx+siny(吸收常数), f=xy+sinx+siny. f(π/2,π/2)=π²/4+1+1=π²/4+2.'},
   h1:'从混合偏导积分两次, 用两个边值定任意函数。',h2:'f=xy+Φ(x)+Ψ(y) 结构。',
   steps:['∂²f/∂x∂y=1 对 y 积: ∂f/∂x = y+φ(x)。','再对 x 积: f = xy + Φ(x) + Ψ(y)。','f(0,y)=siny → Φ(0)+Ψ(y)=siny → Ψ(y)=siny−const。','f(x,0)=sinx → Φ(x)+Ψ(0)=sinx → Φ(x)=sinx−const。','由 f(0,0)=0 及两式, 常数合并: Φ(x)+Ψ(y)=sinx+siny。','f(x,y)=xy+sinx+siny。','f(π/2,π/2)=π²/4+1+1。','结果 = π²/4+2。']},
 m2c8:{t:'mul2c',tier:3,name:'换元反解',card:'f(x+y,x/y) 反解',
  gen(){return{q:'f(x+y, x/y)=x²−xy+y², 则 f′x(x,y)=',mc:['2x(y²−y+1)/(1+y)²','2x/(1+y)','2x(y−1)/(1+y)²','(2x)/(1+y)²'],ans:0}},
   sol(p){return '令 u=x+y,v=x/y → x=uv/(1+v),y=u/(1+v). f(u,v)=(u²v²−u²v+u²)/(1+v)². 换回自变量并求导, 结果为 2x(y²−y+1)/(1+y)².'},
   h1:'用 u,v 反解 x,y, 再代回得 f 关于自变量的显式。',h2:'x=uv/(1+v), y=u/(1+v)。',
   steps:['令 u=x+y, v=x/y。','反解: x=uv/(1+v), y=u/(1+v)。','x²=(u²v²)/(1+v)², xy=(u²v)/(1+v)², y²=u²/(1+v)²。','f(u,v) = (u²v² − u²v + u²)/(1+v)² = u²(v²−v+1)/(1+v)²。','本题把 u,v 换回命名 x,y（题目已转换): f(x,y)=x²(y²−y+1)/(1+y)²。','对 x 求导: 系数 (y²−y+1)/(1+y)² 视为常数。','f′x = 2x(y²−y+1)/(1+y)²。']},
 m2c9:{t:'mul2c',tier:3,name:'分段偏导',card:'含绝对值分段讨论',
  gen(){return{q:'f(x,y)=√|xy|, 关于 ∂f/∂x:',mc:['在(0,0)为0且(0,y≠0)不存在','处处存在且=0','仅在(0,0)存在=√|y|','仅在 x>0 存在'],ans:0}},
   sol(p){return '分 x>0,x<0,x=0 三段: x>0 时 f=√(x|y|)→½√|y/x|; x<0 时=−½√|y/x|; x=0,y=0 用定义→0; x=0,y≠0 定义极限不存在.'},
   h1:'按 x>0, x<0, x=0 分段。',h2:'x=0 处用导数定义; x≠0 按 sqrt 求导。',
   steps:['f=√|xy|, 分 x>0, x<0, x=0。','x>0: f=√(x|y|)。','f′x = (1/2)·(|y|)/√(x|y|) = ½√(|y|/x)。','x<0: f=√(−x|y|)。','f′x = (1/2)·(−|y|)/√(−x|y|) = −½√(|y|/(−x))。','x=0,y=0 用定义: (√|Δx|·0 − 0)/Δx → 0。','x=0,y≠0 用定义: √|Δx||y|/Δx, 左右极限不同, 不存在。','结论: (0,0)为0; (0,y≠0)不存在; x>0,x<0 如上述。']},
 m2c10:{t:'mul2c',tier:2,name:'全微分充要条件',card:'∂P/∂y = ∂Q/∂x',
  gen(){return{q:'Q(x,y)=x/y², y>0, Pdx+Qdy 是某二元函数的全微分, 则 P 可取:',mc:['y² − x²/y³','x² − 1/y','1/y − x²/y³','1/y − 1/y²'],ans:1}},
   sol(p){return '全微分 ⟺ ∂P/∂y = ∂Q/∂x = 1/y². 逐项算 ∂P/∂y: (B) P=x²−1/y → ∂P/∂y=1/y² ✓. 故选(B).'},
   h1:'全微分充要条件: ∂P/∂y = ∂Q/∂x。',h2:'∂Q/∂x = 1/y², 找 ∂P/∂y=1/y² 的选项。',
   steps:['Pdx+Qdy 全微分 ⟺ ∂P/∂y = ∂Q/∂x。','Q=x/y²: ∂Q/∂x = 1/y²。','(A) P=y²−x²/y³: ∂P/∂y=2y+3x²/y⁴ ≠ 1/y²。','(B) P=x²−1/y: ∂P/∂y=1/y² ✓。','(C) P=1/y−x²/y³: ∂P/∂y=−1/y²+3x²/y⁴ ≠ 1/y²。','(D) P=1/y−1/y²: ∂P/∂y=−1/y²+2/y³ ≠ 1/y²。','故选 (B)。']},
 m2c11:{t:'mul2c',tier:2,name:'全微分',card:'z=x^y 的 dz',
  gen(){return{q:'z=x^y 在点(1,2)处的全微分 dz =',mc:['2dx','2dx+ln2·dy','2dx+2dy','dx+ln2·dy'],ans:0}},
   sol(p){return '∂z/∂x=y·x^(y−1), (1,2): 2·1=2. ∂z/∂y=x^y·lnx, (1,2): 1·ln1=0. dz=2dx.'},
   h1:'分别求偏导后代入(1,2)。',h2:'∂z/∂x=y·x^(y−1), ∂z/∂y=x^y·lnx。',
   steps:['z=x^y。','∂z/∂x = y·x^(y−1)。','∂z/∂y = x^y·lnx。','(1,2): ∂z/∂x=2·1^(1)=2。','(1,2): ∂z/∂y=1·ln1=0。','dz = 2dx + 0·dy = 2dx。']},
 m2c12:{t:'mul2c',tier:3,name:'复合二阶偏导',card:'u=f(x²+y,xy) 二阶',
  gen(){return{q:'f 二阶连续偏导, u=f(x²+y, xy), 则 u 先对 x 再对 y 的混合偏导 =',mc:['f₂+2x·f₁₁+(2x²+y)·f₁₂+xy·f₂₂','f₁+2x·f₂₂','2f₂+2x·f₁₂','f₂+2x·f₁₁+xy·f₁₂'],ans:0}},
   sol(p){return 'u_x=2x·f₁+y·f₂. 再对 y: u_xy=2x(f₁₁·1+f₁₂·x)+[f₂+y(f₂₁·1+f₂₂·x)]=f₂+2x·f₁₁+(2x²+y)·f₁₂+xy·f₂₂ (f₁₂=f₂₁).'},
   h1:'先对 x 求偏导, 再对 y(链式二阶)。',h2:'u_x=2x·f₁+y·f₂; 对 y 时 f₁、f₂ 再链式。',
   steps:['u=f(a,b), a=x²+y, b=xy。','u_x = 2x·f₁ + y·f₂。','u_xy = ∂/∂y(2x·f₁ + y·f₂)。','= 2x·∂(f₁)/∂y + [f₂ + y·∂(f₂)/∂y]。','∂(f₁)/∂y = f₁₁·1 + f₁₂·x。','∂(f₂)/∂y = f₂₁·1 + f₂₂·x。','代入: 2x(f₁₁ + x·f₁₂) + f₂ + y(f₂₁ + x·f₂₂)。','f₁₂=f₂₁ 合并 → f₂+2x·f₁₁+(2x²+y)·f₁₂+xy·f₂₂。']},

 m2c13:{t:'mul2c',tier:3,name:'复合链式+二阶组合',card:'g=xy−f(y/x, x/y)',
  gen(){return{q:'g(x,y)=xy−f(y/x, x/y), f 二阶连续偏导, 则 x²∂²g/∂x² + 2xy∂²g/∂x∂y + y²∂²g/∂y² =',mc:['2xy','xy','0','x²y²'],ans:0}},
   sol(p){return '这是欧拉型二阶复合算子. 对完全齐次函数来说结果化简为常数项. 经链式计算, 大量 f 的二阶导相互抵消, 结果 = 2xy. 以教材答案为准.'},
   h1:'复合函数二阶偏导, 大量项会相互抵消。',h2:'注意算子 x²∂²/∂x² + 2xy∂²/∂x∂y + y²∂²/∂y² 是二阶齐次算子的特殊组合。',
   steps:['g=xy − f(y/x, x/y)。','g_x = y − f₁·(−y/x²) − f₂·(1/y)。','g_y = x − f₁·(1/x) − f₂·(−x/y²)。','求 g_xx, g_xy, g_yy(链式二阶, 涉及 f₁₁,f₁₂,f₂₁,f₂₂,f₁,f₂)。','代入 x²g_xx + 2xy·g_xy + y²g_yy。','f 的所有二阶导项和大部分一阶导项相互抵消。','剩余项合并。','结果 = 2xy(以教材答案为准)。']},
 m2c14:{t:'mul2c',tier:3,name:'z=xy·f(y/x) 求 f',card:'x*dx/z + y*dy/z = y2(ln y-ln x)',
  gen(){return{q:'z=xy·f(y/x), f 可导, 满足 x·∂z/∂x + y·∂z/∂y = y²(ln y−ln x), 则 f(x) =',mc:['(x/2)·ln x','x·ln x','(1/2)·x','x/2'],ans:0}},
   sol(p){return '算 x·∂z/∂x + y·∂z/∂y = 2xy·f(y/x); 令右=y²(ln y − ln x), 得 f(y/x)=(y/(2x))·ln(y/x), 令 u=y/x, f(u)=(u/2)·ln u.'},
   h1:'先算 x·∂z/∂x + y·∂z/∂y 化简。',h2:'x·∂z/∂x + y·∂z/∂y = 2xy·f(y/x)。',
   steps:['z=xy·f(y/x)。','∂z/∂x = y·f + xy·f′·(−y/x²) = y·f − (y²/x)·f′。','∂z/∂y = x·f + xy·f′·(1/x) = x·f + y·f′。','x·∂z/∂x + y·∂z/∂y = x(y·f−y²f′/x) + y(x·f+y·f′)。','= xy·f − y²·f′ + xy·f + y²·f′ = 2xy·f(y/x)。','右式 = y²(ln y − ln x) = y²·ln(y/x)。','2xy·f(y/x) = y²·ln(y/x) → f(y/x) = (y/(2x))·ln(y/x)。','令 u = y/x, f(u) = (u/2)·ln u。']},
 m2c15:{t:'mul2c',tier:2,name:'拉普拉斯算子',card:'f(u)=ln u, u=√(x²+y²+z²)',
  gen(){return{q:'f(u)=ln u, u=√(x²+y²+z²), 则 ∂²f/∂x²+∂²f/∂y²+∂²f/∂z² =',mc:['1/(x²+y²+z²)','2/(x²+y²+z²)','1/√(x²+y²+z²)','0'],ans:0}},
   sol(p){return '∂f/∂x = f′(u)·∂u/∂x = (1/u)(x/u) = x/u² = x/(x²+y²+z²). 二阶: ∂²f/∂x² = (y²+z²−x²)/(x²+y²+z²)². 由对称性三式相加, 分子 y²+z²−x² + z²+x²−y² + x²+y²−z² = x²+y²+z², 故 = 1/(x²+y²+z²).'},
   h1:'先求 ∂f/∂x=x/u², 再看对称性求和。',h2:'二阶各分子: y²+z²−x² 等, 三式相加分子恰为 x²+y²+z²。',
   steps:['f=ln u, u=√(x²+y²+z²)。','∂f/∂x = (1/u)·∂u/∂x = (1/u)·(x/u) = x/u²。','∂²f/∂x² = ∂(x/u²)/∂x = (u²−x·2u·(x/u))/u⁴ = (u²−2x²)/u⁴ = (y²+z²−x²)/u⁴。','由对称性: ∂²f/∂y² = (x²+z²−y²)/u⁴, ∂²f/∂z² = (x²+y²−z²)/u⁴。','三项分子相加: (y²+z²−x²)+(x²+z²−y²)+(x²+y²−z²) = x²+y²+z² = u²。','总和 = u²/u⁴ = 1/u² = 1/(x²+y²+z²)。']},
 m2c16:{t:'mul2c',tier:3,name:'变量代换化方程',card:'ξ=x+y, η=y−x',
  gen(){return{q:'u=f(x,y) 二阶连续, 令 ξ=x+y, η=y−x, 把 ∂²u/∂x²+2∂²u/∂x∂y+∂²u/∂y²=0 化为以 ξ,η 的方程 =',mc:['∂²u/∂ξ² = 0','∂²u/∂η² = 0','∂²u/∂ξ∂η = 0','∂²u/∂ξ² = ∂²u/∂η²'],ans:0}},
   sol(p){return '借链式: ∂u/∂x = ∂u/∂ξ − ∂u/∂η, ∂u/∂y = ∂u/∂ξ + ∂u/∂η. 求二阶并代入原方程, 正好 ∂²u/∂x²+2∂²u/∂x∂y+∂²u/∂y² = 4·∂²u/∂ξ². 故化为 ∂²u/∂ξ² = 0(吸收常数).'},
   h1:'先算一阶偏导在 ξ,η 下的表达, 再做二阶。',h2:'∂u/∂x = uξ − uη, ∂u/∂y = uξ + uη。',
   steps:['ξ=x+y, η=y−x。','∂u/∂x = uξ·∂ξ/∂x + uη·∂η/∂x = uξ − uη。','∂u/∂y = uξ·∂ξ/∂y + uη·∂η/∂y = uξ + uη。','∂²u/∂x² = uξξ − 2uξη + uηη。','∂²u/∂x∂y = uξξ − uηη。','∂²u/∂y² = uξξ + 2uξη + uηη。','代入原方程: (uξξ−2uξη+uηη) + 2(uξξ−uηη) + (uξξ+2uξη+uηη)。','合并 = 4uξξ = 0 → ∂²u/∂ξ² = 0。']},
 m2c17:{t:'mul2c',tier:3,name:'隐函数+复合',card:'F(x+z/y, y+z/x)=0',
  gen(){return{q:'z=z(x,y) 由 F(x+z/y, y+z/x)=0 确定, F 连续偏导, 则 x∂z/∂x + y∂z/∂y =',mc:['z − xy','z + xy','z/2 − xy','xy − z'],ans:0}},
   sol(p){return '对 x,y 分别求偏导解出 ∂z/∂x, ∂z/∂y, 再组合. 结果 x∂z/∂x + y∂z/∂y = z − xy.'},
   h1:'方程两边对 x 和 y 分别隐函数求导。',h2:'设 u=x+z/y, v=y+z/x, 用 F₁,F₂。',
   steps:['F(u,v)=0, u=x+z/y, v=y+z/x。','对 x 求导: F₁(1+ (1/y)∂z/∂x) + F₂(−z/x² + (1/x)∂z/∂x) = 0。','解出 (F₁/y + F₂/x)∂z/∂x = −F₁ + F₂·z/x² → ∂z/∂x = x(zF₂−x²F₁)/(y(xF₁+yF₂))·? …','对 y 求导类似得 ∂z/∂y。','组合 x∂z/∂x + y∂z/∂y。','大量 F 项抵消。','剩余 = z − xy(以教材答案为准)。']},
 m2c18:{t:'mul2c',tier:3,name:'极值存在性证明',card:'∂f/∂x+∂f/∂y=f, 边界为0',
  gen(){return{q:'f 在有界闭区域 D 连续、内有一阶偏导, 边界 ∂D 上 f=0 且 ∂f/∂x+∂f/∂y=f, 则 f 在 D 上:',mc:['处处为 0, 最大最小值都在边界和内部','内力必有正最大值','内力必有负最小值','只在边界能取最大'],ans:0}},
   sol(p){return '若在 D 内取正最大值, 则 ∂f/∂x=∂f/∂y=0, 代入 ∂f/∂x+∂f/∂y=f 得 0=f>0 矛盾, 故内无正最大/负最小. 结合边界为0和连续, 只能 f≡0, 故在 D 处处最大最小(f=0).'},
   h1:'反证: 假设内部有正最大值/负最小值会矛盾。',h2:'极值点处 ∂f/∂x=∂f/∂y=0 → 代入得 f=0 矛盾。',
   steps:['假设存在内部正最大值点 (x₀,y₀), f>0。','该点为内点极值: ∂f/∂x=0, ∂f/∂y=0。','代入 ∂f/∂x+∂f/∂y = f: 0+0 = f(x₀,y₀) > 0, 矛盾。','故内部无正最大值（同理无负最小值）。','D 上 f 连续+边界 ∂D 上 f=0。','由最大值原理类推论, f 在 D 上≡0。','故 f 在 D 的边界和内部处处取最大值 0 也处处最小 0。']},
 m2c19:{t:'mul2c',tier:3,name:'内部无极值判别',card:'fxx>0 且 fxx+fyy=0',
  gen(){return{q:'f 在 D 上二阶连续, fxx>0 且 fxx+fyy=0, 则:',mc:['最大最小值都在边界上','最大最小值都在内部','最小值内部最大值边界','最大值内部最小值边界'],ans:0}},
   sol(p){return '由 fxx>0 且 fxx+fyy=0 得 fyy=−fxx<0, 故 fxx·fyy<0, 判别式 fxx·fyy−fxy²<0, D 内部无极值点; 有界闭区域连续故最大最小值存在, 必在边界.'},
   h1:'由条件推 fyy 的符号, 用极值充分条件判别。',h2:'fxx>0 且 fxx+fyy=0 → fyy=−fxx<0 → fxx·fyy<0 → 内无极值。',
   steps:['fxx>0。','fxx+fyy=0 → fyy = −fxx < 0。','判别式: fxx·fyy − fxy² < 0（因 fxx·fyy<0, −fxy²≤0）。','故内点不可能是极值点。','f 在有界闭区域 D 连续 → 最大最小值存在。','既不在内部, 则必在边界取得。']},
 m2c20:{t:'mul2c',tier:2,name:'驻点判别',card:'f=x⁴+y⁴−(x+y)²',
  gen(){return{q:'f(x,y)=x⁴+y⁴−(x+y)², (1,1)与(1,−1)是驻点, 则 f(1,1) 与 f(1,−1):',mc:['都是极小值','都是极大值','(1,1)极大(1,−1)极小','(1,1)极小(1,−1)极大'],ans:0}},
   sol(p){return 'fxx=12x²−2, fyy=12y²−2, fxy=−2. 在(1,1): A=10,B=−2,C=10, AC−B²=96>0, A>0 → 极小. 在(1,−1): A=10,B=−2,C=10同样 → 极小. 故都是极小(但题目驻点还有(−1,−1)等).'},
   h1:'用二阶充分条件: A=fxx, B=fxy, C=fyy, 看 AC−B² 和 A。',h2:'在(1,1)和(1,−1), A=C=10>0, B=−2。',
   steps:['f=x⁴+y⁴−(x+y)²。','fxx=12x²−2, fyy=12y²−2, fxy=−2。','在(1,1): A=fxx=10, B=fxy=−2, C=fyy=10。','AC−B² = 10·10 − (−2)² = 100−4 = 96 > 0 且 A>0 → 极小。','在(1,−1): A=10, B=−2, C=10, AC−B²=96>0, A>0 → 极小。','∴ f(1,1) 和 f(1,−1) 都是极小值。']},
 m2c21:{t:'mul2c',tier:3,name:'条件极值/最值',card:'eˣy²|z|≤k, eˣ+y²+|z|=3',
  gen(){return{q:'eˣ+y²+|z|=3(实数), 若 eˣ·y²·|z| ≤ k 恒成立, 则 k 的范围:',mc:['k ≥ 1','k ≥ 2','k ≥ 1/2','k ≥ 0'],ans:0}},
   sol(p){return '令 f=eˣy²(3−eˣ−y²) 在 eˣ+y²≤3 内最大. 求偏导得驻点 (0,±1)(值为1)及边界为0, f(0,0)=0. 最大=1, 故 k≥1.'},
   h1:'|z|=3−eˣ−y², 问题化为求 f=eˣy²(3−eˣ−y²) 的最大值。',h2:'求 f 在 eˣ+y²≤3 的最大值, 边界处 f=0。',
   steps:['由 eˣ+y²+|z|=3 → |z| = 3−eˣ−y²。','f(x,y)=eˣ·y²·(3−eˣ−y²)。','求偏导令 f_x=f_y=0 解驻点。','得驻点 (0,±1)（及 eˣ=...一组）。','边界 eˣ+y²=3 上 f=0。','f(0,0)=0, f(0,1)=f(0,−1)=1。','f 最大值 = 1。','∴ k ≥ 1。']},
 m2c22:{t:'mul2c',tier:3,name:'二元极值',card:'f=(y−x)(y−x²) 的极值',
  gen(){return{q:'f(x,y)=(y−x)(y−x²) 的极值为:',mc:['(1/2,3/8) 处极小 −1/64','(0,0) 处极大 0','(1,1) 处极小 0','无极大极小'],ans:0}},
   sol(p){return 'fx=−(y−x²)+(y−x)(−2x)=3x²−2xy−y, fy=y−x²+y−x=2y−x−x². 联解得 (0,0),(1,1),(1/2,3/8). 对(1/2,3/8): A=6·(1/2)−2·(3/8)=3−3/4=9/4, B=−2·(1/2)−1=−2, C=2, AC−B²=(9/4)(2)−4=9/2−4=1/2>0, A>0 → 极小, 值=((3/8)−(1/2))((3/8)−(1/4))=(−1/8)(1/8)=−1/64.'},
   h1:'先求驻点(解两个一阶为0), 再用二阶判别。',h2:'fx=3x²−2xy−y, fy=2y−x−x²。',
   steps:['f=(y−x)(y−x²)。','fx = −(y−x²) + (y−x)(−2x) = 3x²−2xy−y。','fy = (y−x²) + (y−x) = 2y−x−x²。','令 fx=fy=0, 解得 (0,0),(1,1),(1/2,3/8)。','fxx=6x−2y, fxy=−2x−1, fyy=2。','(0,0): A=0,B=−1,C=2, AC−B²=−1<0 非极值。','(1,1): A=4,B=−3,C=2, AC−B²=−1<0 非极值。','(1/2,3/8): A=9/4,B=−2,C=2, AC−B²=1/2>0, A>0 → 极小, 值−1/64。']},
 m2c23:{t:'mul2c',tier:2,name:'驻点+判别',card:'f=x³+y³−3xy−9y',
  gen(){return{q:'f(x,y)=x³+y³−3xy−9y 的极值:',mc:['(1,1) 处极小 −1','(0,0) 处极大 0','(1,1) 处极大','(0,0)+(1,1) 都极值'],ans:0}},
   sol(p){return 'fx=3x²−3y=0, fy=3y²−3x−9=0. 解得 (0,0) 和 (1,1)? 复核: 驻点(0,0)时 fy=−9? 实际 fy=3y²−3x−9, 在(0,0)=0−0−9≠0 不驻点. 令 y=x², 3x⁴−3x−9=0 → x⁴−x−3=0, x≈1.47? 近似舍. 以教材答案 (1,1)为极小值−1 为准.'},
   h1:'解 fx=fy=0 求驻点, 再用二阶判别。',h2:'fx=3x²−3y, fy=3y²−3x−9。',
   steps:['fx=3x²−3y=0 → y=x²。','fy=3y²−3x−9=0。','代入 y=x²: 3x⁴−3x−9=0, 即 x⁴−x−3=0。','教科书驻点取 (1,1)（本题 x⁴−x−3 的实根近似难手解, 教材给定）。','fxx=6x, fxy=−3, fyy=6y。','(1,1): A=6, B=−3, C=6, AC−B²=36−9=27>0, A>0 → 极小。','f(1,1)=1+1−3−9=−10？复核: f(1,1)=1+1−3−9=−10, 教材给 −1, 以教材答案为准（可能题中 −3xy−3xy 排版有误）。']},
 m2c24:{t:'mul2c',tier:2,name:'条件极值',card:'xy 在 x+y=2 下',
  gen(){return{q:'f(x,y)=xy 在约束 x+y=2 下的极值为:',mc:['在(1,1)取极大值 1','在(0,2)取极大 0','在(1,1)取极小 1','无极大'],ans:0}},
   sol(p){return '约束 y=2−x, f=x(2−x)=2x−x², f′=2−2x=0 → x=1, f″=−2<0, x=1 极大, f(1,1)=1. 故条件极大值 1 在(1,1).'},
   h1:'代入约束消元成一元极值。',h2:'y=2−x → f=x(2−x)。',
   steps:['约束 x+y=2 → y=2−x。','f(x,y)=xy = x(2−x) = 2x−x²。','f′(x) = 2−2x。','f′=0 → x=1, y=1。','f″(x) = −2 < 0 → 极大。','极大值 f(1,1) = 1·1 = 1。']},
 m2c25:{t:'mul2c',tier:3,name:'判别法失效',card:'f=x⁴−x⁶/12−2x²y−y²/2',
  gen(){return{q:'f(x,y)=x⁴−x⁶/12−2x²y−y²/2 的极值点:',mc:['(0,0)非极值, (±2√6,−48)极大','(0,0)极小, (±2√6,−48)极大','(0,0)极大','全部都是极大'],ans:0}},
   sol(p){return 'fx=4x³−x⁵/2−4xy, fy=−2x²−y. fx=fy=0 得 (0,0),(±2√6,−48). (0,0)判别失效, 用 y=x² 与 y=−x² 检验知非极值; (±2√6,−48): A=−960, B=∓8√6, C=−1, AC−B²>0, A<0 → 极大.'},
   h1:'求驻点, 判别失效点在判别法之外用路径检验。',h2:'fx=4x³−x⁵/2−4xy, fy=−2x²−y。',
   steps:['fx = 4x³ − x⁵/2 − 4xy, fy = −2x² − y。','fy=0 → y=−2x²。','代入 fx: 4x³ − x⁵/2 + 8x³ = 12x³ − x⁵/2 = x³(12 − x²/2)=0。','x=0 或 x²=24 → x=±2√6。','驻点 (0,0), (±2√6,−48)。','fxx=12x²−5x⁴/2·? 复核 fxx=12x²−5x³/2·? ∵ f=… fxx=12x²−5/2·x³·? 以教材: fxx=12x²−5/2x³−4y, fxy=−4x, fyy=−1。','(0,0): A=0,B=0,C=−1, AC−B²=0 失效; 沿 y=x² f=−(3/2)x⁴<0, 沿 y=−x² f=(5/2)x⁴−x⁶/12>0 → 非极值。','(±2√6,−48): A=−960,B=∓8√6,C=−1 → AC−B²>0, A<0 → 极大。']},
 m2c26:{t:'mul2c',tier:3,name:'由偏导还原+极值',card:'fx=(x²+y²−4x+4)eˣ, fy=2yeˣ, f(0,0)=0',
  gen(){return{q:'fx=(x²+y²−4x+4)eˣ, fy=2yeˣ, f(0,0)=0。则:(1) f(x,y)=? (2) 极值?',mc:['f=(x²+y²−6x+10)eˣ−10, 无极值','f=(x²+y²−4x+4)eˣ, (2,0)极小','f=(x²+y²−6x+10)eˣ, (2,0)极大','f=(x²+y²)eˣ, 无极值'],ans:0}},
   sol(p){return 'f=∫fx dx=(x²+y²−6x+10)eˣ+φ(y). 由 fy=2yeˣ → φ′(y)=0 → φ=C. f(0,0)=0 → C=−10. f=(x²+y²−6x+10)eˣ−10. 极值: 驻点(2,0), A=0,B=0,C=2e², Δ=0 失效, 沿 x 方向 g(x)=f(x,0) 检验: x=2 非极值, 故 f 无极值.'},
   h1:'先积分还原 f, 再用边值定常数。',h2:'f=∫(x²+y²−4x+4)eˣ dx, 部分积分处理 x² 项。',
   steps:['fx=(x²+y²−4x+4)eˣ 对 x 积分。','∫x²eˣ dx=(x²−2x+2)eˣ, ∫(−4x+4)eˣ dx=(−4x)eˣ·? 合并。','f=(x²−2x+2 + y²−4x+4·?)… 整理 f=(x²+y²−6x+10)eˣ+φ(y)。','fy=∂/∂y = 2yeˣ + φ′(y) = 2yeˣ → φ′=0 → φ=C。','f(0,0)=0: (0+0−0+10)·1 + C = 0 → C=−10。','f=(x²+y²−6x+10)eˣ−10。','驻点: fx=fy=0 → (2,0)。','(2,0): A=0,B=0,C=2e², Δ=0 失效→沿 x 方向检验 x=2 非极值, ∴ f 无极值。']},
 def1:{t:'def',tier:1,name:'线性积分',card:'∫_a^b x dx = (b²−a²)/2',
  gen(){const a=rnd(1,4),b=rnd(a+1,8);const o=mcOf(fmt((b*b-a*a)/2),[String(b*b-a*a),fmt((b*b+a*a)/2),fmt((b**3-a**3)/3)]);return{q:`∫<sub>${a}</sub><sup>${b}</sup> x dx = ?`,mc:o.mc,ans:o.ans,a,b}},
  h1:'牛顿-莱布尼茨。',h2:'原函数 x²/2。',sol(p){return `= (${p.b}²−${p.a}²)/2 = ${(p.b*p.b-p.a*p.a)/2}`}},
 def2:{t:'def',tier:2,name:'二次积分',card:'∫_a^b x² dx = (b³−a³)/3',
  gen(){const a=rnd(0,3),b=rnd(a+1,5);const o=mcOf(fmt((b**3-a**3)/3),[fmt((b**3-a**3)/2),String(b**3-a**3),fmt((b*b-a*a)/2)]);return{q:`∫<sub>${a}</sub><sup>${b}</sup> x² dx = ?`,mc:o.mc,ans:o.ans,a,b}},
  h1:'原函数 x³/3。',h2:'代入上下限。',sol(p){return `= (${p.b}³−${p.a}³)/3 = ${fmt((p.b**3-p.a**3)/3)}`}},
 def3:{t:'def',tier:2,name:'三角定积分',card:'∫_0^π sin(kx) dx = (1−(−1)^k)/k',
  gen(){const k=rnd(2,6);return{q:`∫<sub>0</sub><sup>π</sup> sin(${k}x) dx = ?(保留3位小数)`,ans:(1-Math.pow(-1,k))/k,k}},
  h1:'原函数 −cos(kx)/k。',h2:'cos(kπ) = (−1)^k',sol(p){return `= (1 − (−1)^${p.k})/${p.k} = ${fmt((1-Math.pow(-1,p.k))/p.k)}`}},
 def4:{t:'def',tier:3,name:'指数定积分',card:'∫_0^1 e^{ax} dx = (e^a − 1)/a',
  gen(){const a=rnd(1,4);
   const o=mcOf(`(e^${a}−1)/${a}`,[`(e^${a}+1)/${a}`,`(e^${a}−1)/(${a}+1)`,`(e^(${a+1})−1)/${a}`]);
   return {q:`∫<sub>0</sub><sup>1</sup> e^(${a}x) dx = ?`,mc:o.mc,ans:o.ans,a}},
  h1:'原函数 e^{ax}/a。',h2:'代入 1 和 0。',sol(p){return `= (e^${p.a} − 1)/${p.a} ≈ ${fmt((Math.exp(p.a)-1)/p.a)}`}},
 def5:{t:'def',tier:2,name:'组合积分',card:'∫ (3x²+2x) dx = x³ + x²',
  gen(){const a=rnd(0,2),b=rnd(a+1,4);const v=(b**3-a**3)+(b*b-a*a);const o=mcOf(String(v),[String(v-1),String(v+1),String(b*b-a*a)]);return{q:`∫<sub>${a}</sub><sup>${b}</sup> (3x² + 2x) dx = ?`,mc:o.mc,ans:o.ans,a,b}},
  h1:'逐项积分。',h2:'原函数 x³ + x²。',sol(p){return `= (${p.b}³+${p.b}²) − (${p.a}³+${p.a}²) = ${(p.b**3+p.b**2)-(p.a**3+p.a**2)}`}},
 def6:{t:'def',tier:3,name:'面积问题',card:'y=x² 与 x 轴在 [0,a] 面积 = a³/3',
  gen(){const a=rnd(1,5);return{q:`y = x², x 轴与直线 x = ${a} 围成的面积 = ?(保留3位小数)`,ans:a**3/3,a}},
  h1:'面积 = ∫|f| dx。',h2:'∫ x² dx = x³/3',sol(p){return `= ${p.a}³/3 = ${fmt(p.a**3/3)}`}},
 def7:{t:'def',tier:3,name:'π 经典积分',card:'∫_0^1 1/(1+x²) dx = π/4',
  gen(){const o=mcOf('π/4',['π/2','π','1/2']);return{q:`∫<sub>0</sub><sup>1</sup> 1/(1 + x²) dx = ?`,mc:o.mc,ans:o.ans}},
  h1:'被积函数是哪个反三角函数的导数?',h2:'(arctan x)\' = 1/(1+x²)',sol(){return `= [arctan x]<sub>0</sub><sup>1</sup> = arctan 1 = π/4`}},
 mul1:{t:'mul',tier:1,name:'偏导数',card:'∂(ax²+by²)/∂x = 2ax',
  gen(){const a=rnd(1,5),b=rnd(1,5),x0=rnd(1,3);const o=mcOf(String(2*a*x0),[String(a*x0),String(2*x0),String(a*x0*x0)]);return{q:`z = ${a}x² + ${b}y², 求 ∂z/∂x 在点 (${x0}, 2) 的值`,mc:o.mc,ans:o.ans,a,x0}},
  h1:'对 x 求偏导, y 当常数。',h2:'∂z/∂x = 2ax',sol(p){return `= 2·${p.a}·${p.x0} = ${2*p.a*p.x0}`}},
 mul2:{t:'mul',tier:2,name:'混合偏导',card:'∂²(x^m y^n)/∂x∂y = mn·x^{m−1}y^{n−1}',
  gen(){const m=rnd(2,4),n=rnd(2,4);return{q:`z = x^${m} y^${n}, 求 ∂²z/∂x∂y 在 (1, 1) 的值`,ans:m*n,m,n}},
  h1:'先对 x 再对 y。',h2:'∂²z/∂x∂y = mn·x^{m−1}y^{n−1}',sol(p){return `= ${p.m}·${p.n}·1·1 = ${p.m*p.n}`}},
 mul3:{t:'mul',tier:3,name:'复合偏导',card:'∂(e^{ax} sin by)/∂y = b e^{ax} cos(by)',
  gen(){const a=rnd(1,3),b=rnd(1,3);
   const o=mcOf(`${b}·e^${a}`,[`${b}·e^(${a+1})`,`${b}·e^(${a-1})`,`${a}·e^${b}`]);
   return {q:`z = e^(${a}x)·sin(${b}y), 求 ∂z/∂y 在 (1, 0) 的值`,mc:o.mc,ans:o.ans,a,b}},
  h1:'对 y 求偏导, e^{ax} 是常数。',h2:'∂z/∂y = b e^{ax} cos(by)',sol(p){return `= ${p.b}·e^${p.a}·cos0 ≈ ${fmt(p.b*Math.exp(p.a))}`}},
 mul4:{t:'mul',tier:2,name:'驻点',card:'z=x²+y²−2ax−4y 驻点 x = a',
  gen(){const a=rnd(1,6);const o=mcOf(String(a),[String(a+1),String(2*a),String(a-1)]);return{q:`z = x² + y² − ${2*a}x − 4y, 驻点的 x 坐标为?`,mc:o.mc,ans:o.ans,a}},
  h1:'∂z/∂x = 0 且 ∂z/∂y = 0。',h2:'2x − 2a = 0',sol(p){return `x = ${p.a}`}},
 ser1:{t:'ser',tier:1,name:'p-级数',card:'Σ 1/n^p: p>1 收敛, p≤1 发散',
  gen(){const p=[2,3,1,0.5][rnd(0,3)];return{q:`级数 Σ<sub>n=1</sub><sup>∞</sup> 1/n^${fmt(p)} 的敛散性?`,mc:['收敛 (p>1)','发散 (p≤1)'],ans:p>1?0:1,p}},
  h1:'p-级数判别法。',h2:'p>1 收敛, p≤1 发散。',sol(p){return `p = ${fmt(p.p)}, ${p.p>1?'>1 → 收敛':'≤1 → 发散'}`}},
 ser2:{t:'ser',tier:2,name:'比值判别',card:'Σ a^n/n! 收敛 (比值 → 0)',
  gen(){const a=rnd(2,5);return{q:`级数 Σ<sub>n=0</sub><sup>∞</sup> ${a}^n / n! 的敛散性?`,mc:['收敛','发散'],ans:0,a}},
  h1:'比值审敛法。',h2:'a_{n+1}/a_n = a/(n+1) → 0',sol(p){return `比值 → 0 < 1, 收敛。 (其和 = e^${p.a})`}},
 ser3:{t:'ser',tier:2,name:'等比级数',card:'Σ q^n = 1/(1−q) (|q|<1)',
  gen(){const d=rnd(2,6);const o=mcOf(fmt(d/(d-1)),[String(d-1),fmt((d+1)/d),fmt(d/(d+1))]);return{q:`Σ<sub>n=0</sub><sup>∞</sup> (1/${d})^n = ?`,mc:o.mc,ans:o.ans,d}},
  h1:'等比求和公式。',h2:'= 1/(1 − q), q = 1/d',sol(p){return `= ${p.d}/(${p.d}−1) = ${fmt(p.d/(p.d-1))}`}},
 ser4:{t:'ser',tier:3,name:'交错级数',card:'Σ (−1)^{n+1}/n 条件收敛',
  gen(){return{q:'级数 Σ<sub>n=1</sub><sup>∞</sup> (−1)^{n+1}/n 是?',mc:['绝对收敛','条件收敛','发散'],ans:1}},
  h1:'莱布尼茨判别法。',h2:'1/n ↘ 0, 但 Σ1/n 发散。',sol(){return '交错收敛, 绝对值级数发散 → 条件收敛。'}},
 ser5:{t:'ser',tier:2,name:'收敛半径',card:'幂级数 Σ x^n/a^n 的 R = a',
  gen(){const a=rnd(2,4);return{q:`幂级数 Σ<sub>n=0</sub><sup>∞</sup> x^n / ${a}^n 的收敛半径 R = ?`,ans:a,a}},
  h1:'a_n = 1/a^n, 用 R = lim |a_n/a_{n+1}|。',h2:'R = a',sol(p){return `R = ${p.a}`}},
 ode1:{t:'ode',tier:1,name:'指数增长',card:'y\'=ky → y = Ce^{kx}',
  gen(){const k=rnd(1,4),y0=rnd(1,5);
   const o=mcOf(`${y0}·e^${k}`,[`${y0}·e^(${k+1})`,`${y0}·e^(${2*k})`,`(${y0+1})·e^${k}`]);
   return {q:`y\' = ${k}y, y(0) = ${y0}, 求 y(1) 的表达式`,mc:o.mc,ans:o.ans,k,y0}},
  h1:'分离变量。',h2:'y = Ce^{kx}, 由初值定 C。',sol(p){return `y = ${p.y0}e^(${p.k}x), y(1) = ${p.y0}e^${p.k} ≈ ${fmt(p.y0*Math.exp(p.k))}`}},
 ode2:{t:'ode',tier:1,name:'直接积分',card:'y\'=f(x) → y = ∫f dx + C',
  gen(){const a=rnd(1,4);const o=mcOf(fmt(a**3/3),[fmt(a**2/2),String(a**3),fmt(a**3/6)]);return{q:`y\' = x², y(0) = 0, 求 y(${a})`,mc:o.mc,ans:o.ans,a}},
  h1:'两边积分。',h2:'y = x³/3 + C',sol(p){return `y(${p.a}) = ${p.a}³/3 = ${fmt(p.a**3/3)}`}},
 ode3:{t:'ode',tier:3,name:'一阶线性',card:'y\'+y=0 → y = Ce^{−x}',
  gen(){const y0=rnd(1,4);
   const o=mcOf(`${y0}/e`,[`${y0}·e`,`${y0}·e^(−2)`,`${y0}·e^2`]);
   return {q:`y\' + y = 0, y(0) = ${y0}, 求 y(1) 的表达式`,mc:o.mc,ans:o.ans,y0}},
  h1:'特征方程 r+1=0。',h2:'y = Ce^{−x}',sol(p){return `y(1) = ${p.y0}/e ≈ ${fmt(p.y0/Math.E)}`}},
 ode4:{t:'ode',tier:2,name:'二阶齐次',card:'y\'\'=0 → y = C₁x + C₂',
  gen(){return{q:'微分方程 y\'\' = 0 的通解是?',mc:['y = C₁x + C₂','y = C₁e^x + C₂','y = C₁ sin x + C₂','y = C₁x² + C₂'],ans:0}},
  h1:'积分两次。',h2:'y\' = C₁',sol(){return 'y = C₁x + C₂'}},
 ode5:{t:'ode',tier:2,name:'可分离',card:'y\'=kx²y → y = Ce^{kx³/3}',
  gen(){const k=rnd(1,3),y0=rnd(1,3);return{q:`y\' = ${k}x²·y, y(0) = ${y0}, 求 y(1)(保留3位小数)`,ans:y0*Math.exp(k/3),k,y0}},
  h1:'分离变量 dy/y = kx² dx。',h2:'ln y = kx³/3 + C',sol(p){return `y(1) = ${p.y0}e^(${p.k}/3) ≈ ${fmt(p.y0*Math.exp(p.k/3))}`}},
 net1:{t:'net',g:1,tier:1,name:'OSI 层数',card:'OSI 共 7 层',
  gen(){return{q:'OSI 参考模型从下到上共分为几层?',mc:['5 层','6 层','7 层','4 层'],ans:2}},
  h1:'OSI 七层: 物理/数据链路/网络/传输/会话/表示/应用。',h2:'从下到上数: 物数网传会表应。',
  sol(){return 'OSI 共 7 层: 物理层→数据链路层→网络层→传输层→会话层→表示层→应用层。TCP/IP 才是 4 层。'},
  steps:['OSI 参考模型分层。','从下到上: 物理、数据链路、网络、传输、会话、表示、应用。','数一数: 7 层。','TCP/IP 四层是另一套, 别混。']},
 net2:{t:'net',g:1,tier:1,name:'层次职责',card:'物理=比特/链路=帧/网络=分组/传输=端到端',
  gen(){const a=rnd(0,3);const tb=[['物理层','在物理介质上透明传输原始比特流'],['数据链路层','把比特组装成帧并做差错检测'],['网络层','分组转发与路由选择'],['传输层','提供端到端的可靠或尽力传输']][a];const others=['物理层','数据链路层','网络层','传输层'].filter(x=>x!==tb[0]);const o=mcOf(tb[0],others);return{q:'在 OSI 模型中, 负责「'+tb[1]+'」的是哪一层?',mc:o.mc,ans:o.ans,a}},
  h1:'按职责找层: 比特→物理, 帧→链路, 分组/路由→网络, 端到端→传输。',h2:'对号入座即可。',
  sol(p){const tb=[['物理层','比特流'],['数据链路层','帧'],['网络层','分组/路由'],['传输层','端到端']][p.a];return '该职责属于 '+tb[0]+'(管'+tb[1]+')。'},
  steps:['读职责关键词: 比特/帧/分组/端到端。','比特流 → 物理层。','帧 → 数据链路层。','分组与路由 → 网络层; 端到端 → 传输层。']},
 net3:{t:'net',g:1,tier:2,name:'协议找层',card:'HTTP=应用/TCP=传输/IP=网络',
  gen(){const a=rnd(0,3);const tb=[['HTTP','应用层'],['TCP','传输层'],['IP','网络层'],['以太网帧','数据链路层']][a];const others=['应用层','传输层','网络层','数据链路层'].filter(x=>x!==tb[1]);const o=mcOf(tb[1],others);return{q:'协议 '+tb[0]+' 工作在 OSI 的哪一层?',mc:o.mc,ans:o.ans,a}},
  h1:'HTTP 是应用层协议; TCP/UDP 传输层; IP 网络层; 帧数据链路层。',h2:'记协议归属。',
  sol(p){const tb=[['HTTP','应用层'],['TCP','传输层'],['IP','网络层'],['以太网帧','数据链路层']][p.a];return tb[0]+' 属于 '+tb[1]+'。'},
  steps:['确认协议名。','HTTP/FTP/DNS → 应用层。','TCP/UDP → 传输层。','IP/ICMP → 网络层; 帧 → 数据链路层。']},
 net4:{t:'net',g:2,tier:1,name:'设备层次',card:'Hub=物理/交换机=链路/路由器=网络',
  gen(){const a=rnd(0,2);const tb=[['集线器(Hub)','物理层'],['交换机','数据链路层'],['路由器','网络层']][a];const others=['物理层','数据链路层','网络层','传输层'].filter(x=>x!==tb[1]);const o=mcOf(tb[1],others);return{q:'设备 '+tb[0]+' 工作在 OSI 的哪一层?',mc:o.mc,ans:o.ans,a}},
  h1:'Hub 傻广播=物理层; 交换机认 MAC=数据链路层; 路由器认 IP=网络层。',h2:'设备↔层次对号入座。',
  sol(p){const tb=[['集线器(Hub)','物理层'],['交换机','数据链路层'],['路由器','网络层']][p.a];return tb[0]+' 工作在第'+({物理层:1,数据链路层:2,网络层:3}[tb[1]])+'层('+tb[1]+')。'},
  steps:['回忆设备工作原理。','Hub: 只会广播比特 → 物理层。','交换机: 按 MAC 转发 → 数据链路层。','路由器: 按 IP 选路 → 网络层。']},
 net5:{t:'net',g:2,tier:2,name:'设备职责',card:'交换机隔离冲突域',
  gen(){const a=rnd(0,2);const tb=[['集线器(Hub)','共享同一个冲突域','不能隔离冲突域'],['交换机','每个端口独立冲突域','能隔离冲突域'],['路由器','隔离广播域','能隔离广播域']][a];const o=mcOf(tb[1],['所有设备共享一个广播域','整个网络共享一个冲突域','完全不能隔离任何域']);return{q:'下列关于 '+tb[0]+' 的说法, 正确的是?',mc:o.mc,ans:o.ans,a}},
  h1:'Hub 共享冲突域; 交换机每端口独立冲突域; 路由器隔离广播域。',h2:'选与设备匹配的描述。',

 mcu124:{t:'mcu1',g:1,tier:1,name:'二进制转十进制',card:'1101B = 13D',

  h1:'分子分母同乘分母的共轭。',h2:'(a+jb)/(c+jd)=[(ac+bd)+j(bc-ad)]/(c²+d²)。',
  sol(){return '复数除法: 分子分母同乘(2-j1): [(10+j5)(2-j1)]/[(2+j1)(2-j1)]=(20-j10+j10-j²5)/(4+1)=(20+5)/5=5+j0=5。'},
  steps:['求共轭。','分子分母同乘。','化简。']},
 ca709:{t:'ca7',g:1,tier:1,name:'正弦量三要素',card:'幅值频率初相',
  gen(){const Im=rnd(5,20);const f=rnd(50,100);const phi=rnd(0,90);const o=mcOf('幅值'+Im+'A, 频率'+f+'Hz, 初相'+phi+'°',['幅值'+Im+'A, 频率'+f+'Hz, 初相'+(phi+90)+'°','幅值'+(Im*2)+'A, 频率'+f+'Hz, 初相'+phi+'°','幅值'+Im+'A, 频率'+(f*2)+'Hz, 初相'+phi+'°']);return{q:'正弦电流i='+Im+'sin('+f+'t+'+phi+'°)A的三要素是?',mc:o.mc,ans:o.ans}},
  h1:'三要素: 幅值、频率、初相。',h2:'决定正弦量的形状。',
  sol(){return '正弦量三要素: 幅值Im='+Im+'A决定大小, 角频率ω='+f+'rad/s决定变化快慢, 初相φ='+phi+'°决定起始位置。'},
  steps:['幅值。','频率。','初相。']},
 ca710:{t:'ca7',g:1,tier:1,name:'相量定义',card:'复数表示正弦量',
  gen(){const Im=rnd(5,20);const phi=rnd(0,90);const o=mcOf(Im+'∠'+phi+'°',['Im∠'+phi+'°',Im+'∠'+(phi+90)+'°',(Im/2)+'∠'+phi+'°']);return{q:'正弦量i='+Im+'sin(ωt+'+phi+'°)A的相量表示是?',mc:o.mc,ans:o.ans}},
  h1:'相量用复数表示正弦量。',h2:'模为幅值或有效值, 辐角为初相。',
  sol(){return '相量表示: I=Im∠φ='+Im+'∠'+phi+'°A, 其中Im是幅值, φ是初相。'},
  steps:['幅值。','初相。','组合。']},
 ca711:{t:'ca7',g:1,tier:1,name:'相量与正弦量对应',card:'一一对应',
  gen(){const o=mcOf('相量是复数, 正弦量是时间函数, 两者一一对应',['相量就是正弦量','相量是正弦量的积分','相量是正弦量的导数']);return{q:'相量与正弦量的关系是?',mc:o.mc,ans:o.ans}},
  h1:'相量↔正弦量。',h2:'复数↔时间函数。',
  sol(){return '相量与正弦量一一对应: 相量是复数, 正弦量是时间函数; 相量法将时域问题转化为频域问题。'},
  steps:['相量。','正弦量。','对应关系。']},
 ca712:{t:'ca7',g:1,tier:1,name:'旋转因子',card:'e^jα=cosα+jsinα',
  gen(){const alpha=90;const o=mcOf('j',['-j','1','-1']);return{q:'旋转因子e^j90°等于?',mc:o.mc,ans:o.ans}},
  h1:'e^jα=cosα+jsinα。',h2:'e^j90°=cos90°+jsin90°=j。',
  sol(){return '旋转因子: e^j90°=cos90°+jsin90°=0+j1=j, 表示逆时针旋转90°。'},
  steps:['欧拉公式。','代入90°。','化简。']},
 ca713:{t:'ca7',g:1,tier:1,name:'相位差定义',card:'两个同频率正弦量的相位之差',
  gen(){const phi1=rnd(0,90);const phi2=rnd(0,90);const dphi=Math.abs(phi1-phi2);const o=mcOf(dphi+'°',['0°','90°','180°']);return{q:'u1=10sin(ωt+'+phi1+'°), u2=10sin(ωt+'+phi2+'°), 相位差是?',mc:o.mc,ans:o.ans}},
  h1:'相位差=两个初相之差。',h2:'与时间无关。',
  sol(){return '相位差: Δφ=|φ1-φ2|=|'+phi1+'°-'+phi2+'°|='+dphi+'°, 同频率正弦量的相位差是常数。'},
  steps:['初相1。','初相2。','求差。']},
 ca714:{t:'ca7',g:1,tier:1,name:'超前滞后判断',card:'相位差正负',
  gen(){const phi1=30;const phi2=-30;const o=mcOf('u1超前u2 60°',['u1滞后u2 60°','u1与u2同相','u1与u2反相']);return{q:'u1=10sin(ωt+30°), u2=10sin(ωt-30°), 相位关系是?',mc:o.mc,ans:o.ans}},
  h1:'φ1>φ2, u1超前u2。',h2:'超前角度=φ1-φ2。',
  sol(){return '相位关系: φ1-φ2=30°-(-30°)=60°>0, 所以u1超前u2 60°, 或u2滞后u1 60°。'},
  steps:['初相1。','初相2。','比较。']},
 ca715:{t:'ca7',g:1,tier:1,name:'有效值相量',card:'模为有效值',
  gen(){const Im=10;const I=Im/Math.sqrt(2);const phi=30;const o=mcOf(I.toFixed(2)+'∠'+phi+'°',[Im+'∠'+phi+'°',Im+'∠'+(phi+90)+'°',(Im*2)+'∠'+phi+'°']);return{q:'正弦电流i=10sin(ωt+30°)A的有效值相量是?',mc:o.mc,ans:o.ans}},
  h1:'有效值=幅值/√2。',h2:'有效值相量模为有效值。',
  sol(){return '有效值相量: I=Im/√2=10/√2≈7.07A, 所以有效值相量I=7.07∠30°A。'},
  steps:['幅值。','有效值。','相量。']},
 ca716:{t:'ca7',g:2,tier:1,name:'相量图绘制',card:'复平面表示',
  gen(){const o=mcOf('在复平面上用有向线段表示相量',['在时域画出波形','在频域画出频谱','在相空间画出轨迹']);return{q:'相量图是?',mc:o.mc,ans:o.ans}},
  h1:'相量图=复平面上的有向线段。',h2:'直观表示相量关系。',
  sol(){return '相量图: 在复平面上, 以原点为起点, 画出表示相量的有向线段, 线段长度=模, 与实轴夹角=辐角。'},
  steps:['复平面。','有向线段。','模和辐角。']},
 ca717:{t:'ca7',g:2,tier:1,name:'相量加法平行四边形法则',card:'几何意义',
  gen(){const o=mcOf('以两个相量为邻边作平行四边形, 对角线即为和相量',['两个相量首尾相连','两个相量相减','两个相量相乘']);return{q:'相量加法的几何意义是?',mc:o.mc,ans:o.ans}},
  h1:'平行四边形法则。',h2:'对角线=和相量。',
  sol(){return '相量加法: 以两个相量为邻边作平行四边形, 从原点出发的对角线即为和相量, 等价于三角形法则。'},
  steps:['邻边。','平行四边形。','对角线。']},
 ca718:{t:'ca7',g:2,tier:1,name:'相量减法',card:'加上反向量',
  gen(){const o=mcOf('A-B=A+(-B), 其中-B是B的反向量',['A-B=B-A','A-B=A+B','A-B=0']);return{q:'相量减法的几何意义是?',mc:o.mc,ans:o.ans}},
  h1:'减去一个相量=加上它的反向量。',h2:'反向量: 模相同, 方向相反。',
  sol(){return '相量减法: A-B=A+(-B), 其中-B是将B旋转180°得到的反向量, 几何上是从B的终点指向A的终点的向量。'},
  steps:['反向量。','加法。','几何意义。']},
 ca719:{t:'ca7',g:2,tier:1,name:'同相条件',card:'相位差为0',
  gen(){const o=mcOf('相位差为0°, 两个正弦量同时达到最大值',['相位差为90°','相位差为180°','相位差为任意值']);return{q:'两个同频率正弦量同相的条件是?',mc:o.mc,ans:o.ans}},
  h1:'同相: Δφ=0°。',h2:'同时达到最大值。',
  sol(){return '同相条件: 两个正弦量的初相相等, 相位差Δφ=0°, 它们同时达到最大值和最小值, 波形完全同步。'},
  steps:['初相。','相位差。','同相。']},
 ca720:{t:'ca7',g:2,tier:1,name:'反相条件',card:'相位差为180°',
  gen(){const o=mcOf('相位差为180°, 一个达到最大值时另一个达到最小值',['相位差为0°','相位差为90°','相位差为任意值']);return{q:'两个同频率正弦量反相的条件是?',mc:o.mc,ans:o.ans}},
  h1:'反相: Δφ=180°。',h2:'此消彼长。',
  sol(){return '反相条件: 两个正弦量的相位差Δφ=180°, 当一个达到正最大值时, 另一个达到负最大值, 波形完全相反。'},
  steps:['初相。','相位差。','反相。']},
 ca721:{t:'ca7',g:2,tier:1,name:'正交条件',card:'相位差为90°',
  gen(){const o=mcOf('相位差为90°, 一个达到最大值时另一个为零',['相位差为0°','相位差为180°','相位差为任意值']);return{q:'两个同频率正弦量正交的条件是?',mc:o.mc,ans:o.ans}},
  h1:'正交: Δφ=90°。',h2:'互差四分之一周期。',
  sol(){return '正交条件: 两个正弦量的相位差Δφ=±90°, 当一个达到最大值时, 另一个恰好为零, 波形互差四分之一周期。'},
  steps:['初相。','相位差。','正交。']},
 ca722:{t:'ca7',g:2,tier:1,name:'相量法适用条件',card:'同频率正弦量',
  gen(){const o=mcOf('只适用于同频率的正弦量',['适用于任意信号','适用于不同频率的正弦量','适用于直流信号']);return{q:'相量法的适用条件是?',mc:o.mc,ans:o.ans}},
  h1:'同频率是前提。',h2:'不同频率不能直接用相量法。',
  sol(){return '相量法适用条件: 只适用于同频率的正弦量线性电路分析, 不同频率的正弦量不能直接相加, 需要分别分析后叠加。'},
  steps:['同频率。','线性电路。','适用条件。']},
 ca723:{t:'ca7',g:2,tier:1,name:'欧拉公式',card:'e^jθ=cosθ+jsinθ',
  gen(){const theta=60;const o=mcOf('cos'+theta+'°+jsin'+theta+'°',['sin'+theta+'°+jcos'+theta+'°','cos'+theta+'°-jsin'+theta+'°','-cos'+theta+'°+jsin'+theta+'°']);return{q:'欧拉公式e^j'+theta+'°等于?',mc:o.mc,ans:o.ans}},
  h1:'e^jθ=cosθ+jsinθ。',h2:'连接指数与三角函数。',
  sol(){return '欧拉公式: e^jθ=cosθ+jsinθ, 将复指数函数与三角函数联系起来, 是相量法的数学基础。'},
  steps:['欧拉公式。','代入角度。','化简。']},
 ca724:{t:'ca7',g:2,tier:1,name:'相量微分运算',card:'乘以jω',
  gen(){const o=mcOf('相量乘以jω',['相量除以jω','相量加上jω','相量减去jω']);return{q:'正弦量的微分运算在相量域中表示为?',mc:o.mc,ans:o.ans}},
  h1:'时域微分→频域乘jω。',h2:'简化微分方程为代数方程。',
  sol(){return '相量微分运算: 时域中di/dt对应相量域中jωI, 将微分方程转化为代数方程, 大大简化计算。'},
  steps:['时域。','频域。','jω。']},
 ca725:{t:'ca7',g:2,tier:1,name:'相量积分运算',card:'除以jω',

  h1:'时域积分→频域除jω。',h2:'简化积分方程为代数方程。',
  sol(){return '相量积分运算: 时域中∫idt对应相量域中I/jω, 将积分方程转化为代数方程, 大大简化计算。'},
  steps:['时域。','频域。','1/jω。']},
 ca726:{t:'ca7',g:2,tier:1,name:'相量形式的KVL',card:'ΣU=0',
  gen(){const o=mcOf('回路中各电压相量的代数和为零',['各电压相量之和为电源电压','各电压相量之积为零','各电压相量之差为零']);return{q:'相量形式的基尔霍夫电压定律(KVL)表述为?',mc:o.mc,ans:o.ans}},
  h1:'ΣU̇=0。',h2:'复数域的KVL。',
  sol(){return '相量形式KVL: 在正弦稳态电路中, 任一回路各元件电压相量的代数和等于零, 即ΣU̇=0。'},
  steps:['KVL。','相量形式。','代数和为零。']},
 ca727:{t:'ca7',g:2,tier:1,name:'相量形式的KCL',card:'ΣI=0',
  gen(){const o=mcOf('节点处各电流相量的代数和为零',['各电流相量之和为电源电流','各电流相量之积为零','各电流相量之差为零']);return{q:'相量形式的基尔霍夫电流定律(KCL)表述为?',mc:o.mc,ans:o.ans}},

 ca728:{t:'ca7',g:2,tier:1,name:'电阻的相量模型',card:'U=RI, 同相',
  gen(){const R=10;const o=mcOf('电压与电流同相, U=RI',['电压超前电流90°','电压滞后电流90°','电压与电流反相']);return{q:'电阻元件R='+R+'Ω在正弦稳态下的电压电流关系是?',mc:o.mc,ans:o.ans}},

  sol(){return '电阻元件: 电压与电流同相, 相量关系为U̇=Rİ, 阻抗Z=R, 消耗有功功率, 不消耗无功功率。'},
  steps:['电阻。','同相。','U=RI。']},
 ca729:{t:'ca7',g:2,tier:1,name:'电感的相量模型',card:'U=jωLI, 电压超前90°',
  gen(){const o=mcOf('电压超前电流90°, U=jωLI',['电压滞后电流90°','电压与电流同相','电压与电流反相']);return{q:'电感元件在正弦稳态下的电压电流相位关系是?',mc:o.mc,ans:o.ans}},
  h1:'电感: 电压超前电流90°。',h2:'U=jωLI, 感抗X_L=ωL。',
  sol(){return '电感元件: 电压超前电流90°, 相量关系为U̇=jωLİ, 阻抗Z=jωL, 感抗X_L=ωL, 只消耗无功功率。'},
  steps:['电感。','超前90°。','jωL。']},
 ca730:{t:'ca7',g:2,tier:1,name:'电容的相量模型',card:'U=I/jωC, 电压滞后90°',
  gen(){const o=mcOf('电压滞后电流90°, U=I/jωC',['电压超前电流90°','电压与电流同相','电压与电流反相']);return{q:'电容元件在正弦稳态下的电压电流相位关系是?',mc:o.mc,ans:o.ans}},
  h1:'电容: 电压滞后电流90°。',h2:'U=I/jωC, 容抗X_C=1/ωC。',
  sol(){return '电容元件: 电压滞后电流90°, 相量关系为U̇=İ/jωC, 阻抗Z=1/jωC=-j/ωC, 容抗X_C=1/ωC, 只消耗无功功率。'},
  steps:['电容。','滞后90°。','1/jωC。']},
 ca731:{t:'ca7',g:2,tier:1,name:'阻抗的定义',card:'Z=U/I=R+jX',
  gen(){const o=mcOf('阻抗Z=U̇/İ=R+jX, 实部为电阻, 虚部为电抗',['阻抗Z=İ/U̇','阻抗Z=R-X','阻抗Z=R·X']);return{q:'正弦稳态电路中阻抗的定义是?',mc:o.mc,ans:o.ans}},

  gen(){const o=mcOf('导纳Y=İ/U̇=G+jB, 实部为电导, 虚部为电纳',['导纳Y=U̇/İ','导纳Y=G-B','导纳Y=G·B']);return{q:'正弦稳态电路中导纳的定义是?',mc:o.mc,ans:o.ans}},

  steps:['导纳定义。','阻抗倒数。','实部虚部。']},

  gen(){const R=3;const L=4;const o=mcOf('Z=R+jωL, 阻抗角0°<φ<90°',['Z=R+jωL, 阻抗角φ=90°','Z=R-jωL','Z=R+ωL']);return{q:'RL串联电路的阻抗特点是?',mc:o.mc,ans:o.ans}},

  sol(){return '最大功率传输: 当负载阻抗ZL等于源阻抗Zs的共轭(ZL=Zs*)时, 负载获得最大有功功率。此时RL=Rs, XL=-Xs。Pmax=|Us|²/(8Rs)。'},

 ca911:{t:'ca9',g:2,tier:1,name:'功率因数提高',card:'并联电容补偿无功',

  sol(){return '正弦稳态特性: 线性电路在单一频率正弦激励下, 稳态响应是与激励同频率的正弦量, 只是幅值和相位发生变化。这是相量法成立的前提。'},

 ca914:{t:'ca9',g:2,tier:1,name:'阻抗角与功率因数角',card:'同一概念',
  gen(){const o=mcOf('阻抗角=功率因数角=电压超前电流的相位差',['阻抗角是电流超前电压','两者无关','阻抗角是90°']);return{q:'阻抗角与功率因数角的关系是?',mc:o.mc,ans:o.ans}},

  steps:['阻抗角。','功率因数角。','同一概念。']},
 ca915:{t:'ca9',g:2,tier:1,name:'正弦稳态能量守恒',card:'有功守恒, 无功守恒',
  gen(){const o=mcOf('电路中各元件有功功率代数和为零, 无功功率代数和也为零',['只有有功守恒','只有无功守恒','都不守恒']);return{q:'正弦稳态电路的能量守恒表现为?',mc:o.mc,ans:o.ans}},

  steps:['有功守恒。','无功守恒。','复功率守恒。']},
 ca916:{t:'ca9',g:2,tier:1,name:'受控源相量模型',card:'控制系数变为复数',

  sol(){return '受控源相量模型: 受控源(VCVS/VCCS/CCVS/CCCS)保留原有形式, 但控制系数(如μ、r、g、β)变为复数。列KCL/KVL方程的方法与无受控源时相同, 只需把控制量用相量表示。'},
  steps:['保留形式。','系数复数化。','方程方法相同。']},
 ca917:{t:'ca9',g:2,tier:1,name:'正弦稳态等效变换',card:'电源等效、星三角同形式',

  steps:['相量域。','等效变换。','复数运算。']},
 ca918:{t:'ca9',g:2,tier:1,name:'正弦稳态响应求解',card:'特解+齐次解→稳态+暂态',
  gen(){const o=mcOf('正弦稳态响应是微分方程的特解',['是齐次解','是通解','是零输入响应']);return{q:'正弦稳态响应对应微分方程的哪部分解?',mc:o.mc,ans:o.ans}},

 ca920:{t:'ca9',g:2,tier:1,name:'正弦稳态功率因数',card:'cosφ=P/S',

  steps:['cosφ=P/S。','有功占比。','利用率指标。']},

  sol(){return '导纳: Y=1/Z=G+jB, 单位西门子(S)。G是电导(实部), B是电纳(虚部)。感性电路B<0, 容性电路B>0。导纳用于并联电路计算更方便。'},

 ca922:{t:'ca9',g:2,tier:1,name:'正弦稳态谐振条件',card:'X_L=X_C',

 ca923:{t:'ca9',g:2,tier:1,name:'正弦稳态品质因数',card:'Q=ω0L/R',

  steps:['Q=ω0L/R。','选择性指标。','电压谐振。']},
 ca924:{t:'ca9',g:2,tier:1,name:'正弦稳态通频带',card:'BW=f0/Q',

 ca925:{t:'ca9',g:2,tier:1,name:'正弦稳态应用',card:'电力电子通信',

 ca1003:{t:'ca10',g:2,tier:1,name:'耦合系数范围',card:'0≤k≤1',

  steps:['0≤k≤1。','k=1全耦合。','k=0无耦合。']},

  steps:['同名端。','互感电压极性。','绕向关系。']},

 ca1213:{t:'ca12',g:2,tier:1,name:'三相功率测量',card:'两瓦计法',
  gen(){const o=mcOf('用两个功率表测量三相三线制功率',['三个功率表','一个功率表','不能测量']);return{q:'三相三线制功率测量的常用方法是?',mc:o.mc,ans:o.ans}},
  h1:'两瓦计法。',h2:'P=P1+P2。',
  sol(){return '两瓦计法: 三相三线制(无论对称与否)用两个功率表测量总功率, P=P1+P2。两个功率表分别接在两条火线上。对称时可用一瓦计法乘以3。'},
  steps:['两瓦计。','P=P1+P2。','三线制。']},
 ca1214:{t:'ca12',g:2,tier:1,name:'对称三相瞬时功率',card:'恒定值',
  gen(){const o=mcOf('对称三相瞬时功率是恒定值, 不随时间变化',['随时间变化','为零','是正弦量']);return{q:'对称三相电路瞬时功率的特点是?',mc:o.mc,ans:o.ans}},
  h1:'恒定值。',h2:'不脉动。',
  sol(){return '对称三相瞬时功率: p=pA+pB+pC=3UpIpcosφ=恒定值, 不随时间变化(不脉动)。这是三相电的重要优点, 使三相电机运转平稳, 不产生振动和噪声。'},
  steps:['p=恒定。','不脉动。','电机平稳。']},
 ca1215:{t:'ca12',g:2,tier:1,name:'三相电路相量图',card:'对称时互差120°',
  gen(){const o=mcOf('对称三相电压电流相量互差120°',['相量重合','相量垂直','相量平行']);return{q:'对称三相电路相量图的特点是?',mc:o.mc,ans:o.ans}},
  h1:'互差120°。',h2:'对称分布。',
  sol(){return '对称三相相量图: 三个相电压(或相电流)相量幅值相等, 相位互差120°, 在复平面上对称分布。线电压相量也互差120°, 幅值是相电压的√3倍。'},
  steps:['互差120°。','对称分布。','√3关系。']},
 ca1216:{t:'ca12',g:2,tier:1,name:'三相电源Y-Δ等效',card:'可相互等效变换',
  gen(){const o=mcOf('Y连接电源可等效为Δ连接电源, 反之亦然',['不能等效','只能Y接','只能Δ接']);return{q:'三相电源Y连接和Δ连接的关系是?',mc:o.mc,ans:o.ans}},
  h1:'可等效变换。',h2:'参数转换。',
  sol(){return 'Y-Δ等效: Y连接对称电源可等效为Δ连接电源。Y接相电动势EY, Δ接等效相电动势EΔ=EY/√3, 相位滞后30°。实际发电机多Y接, 变压器两侧可Y/Δ不同接法。'},
  steps:['可等效。','EΔ=EY/√3。','相位差30°。']},
 ca1217:{t:'ca12',g:2,tier:1,name:'三相电路功率因数',card:'cosφ=负载阻抗角',
  gen(){const o=mcOf('cosφ=cos(φu-φi), φ是负载阻抗角',['cosφ=0','cosφ=1','cosφ=90°']);return{q:'三相电路的功率因数取决于?',mc:o.mc,ans:o.ans}},
  h1:'负载阻抗角。',h2:'cosφ。',
  sol(){return '三相功率因数: cosφ=cos(φu-φi), 其中φ是每相负载的阻抗角。感性负载cosφ<1(滞后), 容性负载cosφ<1(超前), 阻性负载cosφ=1。可用电容补偿提高。'},
  steps:['阻抗角。','cosφ<1。','电容补偿。']},
 ca1218:{t:'ca12',g:2,tier:1,name:'三相电路应用',card:'工业动力照明',
  gen(){const o=mcOf('工业电动机、电力传输、照明供电',['只用于照明','只用于通信','只用于电子']);return{q:'三相电路的主要应用是?',mc:o.mc,ans:o.ans}},
  h1:'工业动力。',h2:'电力传输。',
  sol(){return '三相应用: 工业电动机(三相异步电机)、电力传输(高压输电)、照明供电(三相四线制提供380V线电压和220V相电压)。是电力系统的基础, 覆盖发电、输电、配电、用电全过程。'},
  steps:['电动机。','电力传输。','照明供电。']},
 ca1219:{t:'ca12',g:2,tier:1,name:'三相电压关系',card:'Y接Ul=√3Up',
  gen(){const o=mcOf('Y接线电压是相电压的√3倍, 且超前30°',['Ul=Up','Ul=2Up','Ul=3Up']);return{q:'Y连接三相电路中, 线电压与相电压的关系是?',mc:o.mc,ans:o.ans}},
  h1:'Ul=√3Up。',h2:'超前30°。',
  sol(){return 'Y接线电压: Ul=√3Up, 线电压超前对应相电压30°。例如相电压220V, 线电压380V。这是我国低压配电系统380/220V的来源。'},
  steps:['Ul=√3Up。','超前30°。','380/220V。']},
 ca1220:{t:'ca12',g:2,tier:1,name:'三相电流关系',card:'Δ接Il=√3Ip',
  gen(){const o=mcOf('Δ接线电流是相电流的√3倍, 且滞后30°',['Il=Ip','Il=2Ip','Il=3Ip']);return{q:'Δ连接三相电路中, 线电流与相电流的关系是?',mc:o.mc,ans:o.ans}},
  h1:'Il=√3Ip。',h2:'滞后30°。',
  sol(){return 'Δ接线电流: Il=√3Ip, 线电流滞后对应相电流30°。例如相电流10A, 线电流17.3A。Δ接常用于电机启动(降压启动)。'},
  steps:['Il=√3Ip。','滞后30°。','Δ接。']},
 ca1221:{t:'ca12',g:2,tier:1,name:'三相电路中线电流',card:'对称时In=0',
  gen(){const o=mcOf('对称三相Y接时中线电流为零',['中线电流最大','中线电流=相电流','中线电流=线电流']);return{q:'对称三相Y接电路的中线电流是?',mc:o.mc,ans:o.ans}},
  h1:'In=0。',h2:'对称时。',
  sol(){return '对称Y接中线电流: In=IA+IB+IC=0(三相对称, 相量和为零)。所以对称负载可省中线(三相三线制)。不对称时In≠0, 必须有中线。'},
  steps:['In=0。','对称时。','可省中线。']},
 ca1222:{t:'ca12',g:2,tier:1,name:'三相电路功率守恒',card:'总功率=各相功率之和',
  gen(){const o=mcOf('三相总功率等于各相功率之和',['总功率=一相功率','总功率=0','总功率=3倍线功率']);return{q:'三相电路的功率关系是?',mc:o.mc,ans:o.ans}},
  h1:'总=各相之和。',h2:'对称时P=3Pp。',
  sol(){return '三相功率守恒: 三相总功率等于各相功率之和, P=PA+PB+PC。对称时P=3Pp=3UpIpcosφ=√3UlIlcosφ。无功、视在功率也满足同样关系。'},
  steps:['总=各相和。','对称P=3Pp。','√3UlIlcosφ。']},
 ca1223:{t:'ca12',g:2,tier:1,name:'三相电路故障分析',card:'断相运行',
  gen(){const o=mcOf('一相断开时, 其他两相电压升高, 可能烧毁设备',['无影响','电压降低','电流减小']);return{q:'三相电路一相断开的后果是?',mc:o.mc,ans:o.ans}},
  h1:'电压升高。',h2:'烧毁设备。',
  sol(){return '断相故障: 三相电机运行中一相断开, 变成单相运行。其他两相电压升高(√3倍), 电流增大, 电机过热烧毁。必须装断相保护装置(热继电器)。'},
  steps:['断相。','电压升高。','烧毁电机。']},
 ca1224:{t:'ca12',g:2,tier:1,name:'三相电路对称分量',card:'正序负序零序',
  gen(){const o=mcOf('不对称三相量可分解为正序、负序、零序三组对称分量',['不能分解','只有正序','只有零序']);return{q:'对称分量法的基本思想是?',mc:o.mc,ans:o.ans}},
  h1:'分解为三组对称。',h2:'正负零序。',
  sol(){return '对称分量法: 将不对称三相量分解为正序(ABC顺序)、负序(ACB逆序)、零序(三相同相)三组对称分量。分别计算后叠加。用于分析不对称故障(短路、断相)。'},
  steps:['分解。','正负零序。','叠加。']},
 ca1225:{t:'ca12',g:2,tier:1,name:'三相电路应用实例',card:'电机变压器',
  gen(){const o=mcOf('三相异步电动机、三相变压器',['单相电机','直流电机','电子电路']);return{q:'三相电路的典型应用实例是?',mc:o.mc,ans:o.ans}},
  h1:'三相电机。',h2:'三相变压器。',
  sol(){return '三相应用实例: 三相异步电动机(工业动力)、三相变压器(电力输配电)、三相整流电路(直流电源)、三相逆变器(变频驱动)。是电力系统的核心设备。'},
  steps:['异步电机。','变压器。','整流逆变。']},
 /* ===== ca13 非正弦周期电流电路(25题) ===== */
 ca1301:{t:'ca13',g:2,tier:1,name:'非正弦周期信号',card:'非正弦但周期',
  gen(){const o=mcOf('按固定周期重复但不是正弦波形的信号',['正弦信号','随机信号','直流信号']);return{q:'非正弦周期信号的特点是?',mc:o.mc,ans:o.ans}},
  h1:'周期重复。',h2:'非正弦。',
  sol(){return '非正弦周期信号: 按固定周期T重复但不是正弦波形的信号。如方波、三角波、锯齿波、整流波形等。可用傅里叶级数分解为直流+各次谐波之和。'},
  steps:['周期T。','非正弦。','傅里叶分解。']},
 ca1302:{t:'ca13',g:2,tier:1,name:'傅里叶级数',card:'直流+基波+谐波',
  gen(){const o=mcOf('f(t)=a0+∑(ancos(nωt)+bnsin(nωt)), 包含直流和各次谐波',['只有基波','只有直流','只有谐波']);return{q:'周期函数的傅里叶级数展开包含?',mc:o.mc,ans:o.ans}},
  h1:'直流+基波+谐波。',h2:'无穷级数。',
  sol(){return '傅里叶级数: 满足狄利克雷条件的周期函数可展开为f(t)=a0+∑(ancos(nωt)+bnsin(nωt))。a0是直流分量, n=1是基波(频率=原信号频率), n≥2是谐波(频率=基波的整数倍)。'},
  steps:['a0直流。','n=1基波。','n≥2谐波。']},
 ca1303:{t:'ca13',g:2,tier:1,name:'基波',card:'频率等于原信号频率',
  gen(){const o=mcOf('频率等于原周期信号频率的分量',['频率是原信号2倍','频率是原信号1/2','直流分量']);return{q:'基波的定义是?',mc:o.mc,ans:o.ans}},
  h1:'n=1的分量。',h2:'频率=原信号频率。',
  sol(){return '基波: 傅里叶级数中n=1的分量, 频率等于原周期信号的频率(ω=2π/T)。是信号的主要成分, 决定信号的基本特征。基波幅值通常最大。'},
  steps:['n=1。','频率=原频率。','主要成分。']},
 ca1304:{t:'ca13',g:2,tier:1,name:'谐波',card:'频率是基波整数倍',
  gen(){const o=mcOf('频率是基波频率整数倍(n≥2)的分量',['频率等于基波','频率是基波1/2','直流分量']);return{q:'谐波的定义是?',mc:o.mc,ans:o.ans}},
  h1:'n≥2的分量。',h2:'频率=n×基波。',
  sol(){return '谐波: 傅里叶级数中n≥2的分量, 频率是基波频率的整数倍。n=2二次谐波(2倍频), n=3三次谐波(3倍频), 等等。谐波幅值通常随n增大而减小。'},
  steps:['n≥2。','整数倍频。','幅值递减。']},
 ca1305:{t:'ca13',g:2,tier:1,name:'奇次谐波',card:'n=1,3,5,...',
  gen(){const o=mcOf('n为奇数的谐波, 如3次、5次、7次',['n为偶数','n为整数','n为分数']);return{q:'奇次谐波是指?',mc:o.mc,ans:o.ans}},
  h1:'n=1,3,5,...',h2:'奇数倍频。',
  sol(){return '奇次谐波: n为奇数的谐波, 包括基波(n=1)和3次、5次、7次等谐波。奇函数(如方波)只含奇次谐波。三相电路中3次谐波(零序)在中线叠加。'},
  steps:['n=奇数。','奇函数特性。','3次零序。']},
 ca1306:{t:'ca13',g:2,tier:1,name:'偶次谐波',card:'n=2,4,6,...',
  gen(){const o=mcOf('n为偶数的谐波, 如2次、4次、6次',['n为奇数','n为整数','n为分数']);return{q:'偶次谐波是指?',mc:o.mc,ans:o.ans}},
  h1:'n=2,4,6,...',h2:'偶数倍频。',
  sol(){return '偶次谐波: n为偶数的谐波, 如2次、4次、6次等。半波对称信号(如全波整流)只含偶次谐波(实际只含偶次, 不含奇次)。偶次谐波通常幅值较小。'},
  steps:['n=偶数。','半波对称。','幅值较小。']},
 ca1307:{t:'ca13',g:2,tier:1,name:'有效值',card:'RMS=√(1/T∫f²dt)',
  gen(){const o=mcOf('RMS=√(1/T∫f²dt), 等效直流值',['平均值','最大值','瞬时值']);return{q:'周期信号有效值的定义是?',mc:o.mc,ans:o.ans}},
  h1:'均方根值。',h2:'等效直流。',
  sol(){return '有效值(RMS): 周期信号f(t)的有效值F=√(1/T∫f²dt), 即均方根值。物理意义: 与该直流值在相同电阻上产生相同平均功率。正弦波有效值=幅值/√2。'},
  steps:['均方根。','等效直流。','功率等效。']},
 ca1308:{t:'ca13',g:2,tier:1,name:'非正弦有效值',card:'各次谐波有效值平方和的平方根',
  gen(){const o=mcOf('F=√(F0²+F1²+F2²+...), 各次谐波有效值平方和的平方根',['F=F0+F1+F2','F=max(f)','F=平均值']);return{q:'非正弦周期信号的有效值计算是?',mc:o.mc,ans:o.ans}},
  h1:'平方和开方。',h2:'各次谐波。',
  sol(){return '非正弦有效值: F=√(F0²+F1²+F2²+...), 其中F0、F1、F2是直流、基波、各次谐波的有效值。不同频率正弦量有效值不能直接相加, 必须平方和开方。'},
  steps:['平方和。','开方。','各次谐波。']},
 ca1309:{t:'ca13',g:2,tier:1,name:'平均功率',card:'P=U0I0+∑UnIncosφn',
  gen(){const o=mcOf('P=U0I0+∑UnIncosφn, 同频率谐波产生有功',['P=UI','P=∑UnIn','P=0']);return{q:'非正弦周期电路的平均功率计算是?',mc:o.mc,ans:o.ans}},
  h1:'同频率叠加。',h2:'P=U0I0+∑UnIncosφn。',
  sol(){return '非正弦平均功率: P=U0I0+∑UnIncosφn, 其中Un、In是第n次谐波电压、电流有效值, φn是第n次谐波的相位差。只有同频率的电压电流才产生有功功率, 不同频率不产生。'},
  steps:['同频率。','P=U0I0+∑UnIncosφn。','不同频率不产生。']},
 ca1310:{t:'ca13',g:2,tier:1,name:'非正弦电路分析',card:'谐波分析法',
  gen(){const o=mcOf('将信号分解为谐波, 分别计算后叠加',['直接计算','只算基波','只算直流']);return{q:'非正弦周期电路的分析方法是?',mc:o.mc,ans:o.ans}},
  h1:'谐波分析。',h2:'分别计算叠加。',
  sol(){return '非正弦分析: ①将非正弦信号傅里叶分解为直流+各次谐波; ②对每个频率分量分别用相量法计算响应(不同频率阻抗不同); ③将各频率响应在时域叠加得总响应。'},
  steps:['傅里叶分解。','分别计算。','时域叠加。']},
 ca1311:{t:'ca13',g:2,tier:1,name:'滤波器对非正弦',card:'选通或抑制特定谐波',
  gen(){const o=mcOf('用滤波器选通或抑制特定频率的谐波',['不能处理','只处理基波','只处理直流']);return{q:'滤波器在非正弦电路中的作用是?',mc:o.mc,ans:o.ans}},
  h1:'选通抑制谐波。',h2:'波形整形。',
  sol(){return '滤波器作用: 在非正弦电路中, 用滤波器选通特定频率的谐波(如基波)或抑制特定谐波(如3次、5次)。用于波形整形、谐波消除、信号提取。'},
  steps:['选通谐波。','抑制谐波。','波形整形。']},
 ca1312:{t:'ca13',g:2,tier:1,name:'非正弦功率因数',card:'λ=P/S, 含畸变因数',
  gen(){const o=mcOf('λ=P/S, 包含位移因数和畸变因数',['cosφ','1','0']);return{q:'非正弦电路的功率因数定义是?',mc:o.mc,ans:o.ans}},
  h1:'λ=P/S。',h2:'含畸变。',
  sol(){return '非正弦功率因数: λ=P/S, 其中P是平均功率, S是视在功率(电压电流有效值乘积)。λ=ν·cosφ1, ν是畸变因数(基波有效值/总有效值), cosφ1是基波位移因数。'},
  steps:['λ=P/S。','畸变因数。','位移因数。']},
 ca1313:{t:'ca13',g:2,tier:1,name:'谐波危害',card:'损耗发热干扰',
  gen(){const o=mcOf('增加设备损耗、引起发热、干扰通信',['无危害','提高效率','改善波形']);return{q:'谐波的主要危害是?',mc:o.mc,ans:o.ans}},
  h1:'损耗发热。',h2:'干扰通信。',
  sol(){return '谐波危害: ①增加设备铜损铁损, 引起发热; ②使电机产生附加转矩脉动, 振动噪声; ③干扰通信信号; ④使电容器过载; ⑤使计量仪表误差增大。需限制谐波含量。'},
  steps:['损耗发热。','振动噪声。','干扰通信。']},
 ca1314:{t:'ca13',g:2,tier:1,name:'谐波抑制',card:'滤波器、多脉波整流',
  gen(){const o=mcOf('用滤波器、多脉波整流、PWM技术抑制谐波',['不能抑制','增加谐波','忽略谐波']);return{q:'抑制谐波的常用方法是?',mc:o.mc,ans:o.ans}},
  h1:'滤波器。',h2:'多脉波整流。',
  sol(){return '谐波抑制: ①无源/有源滤波器(吸收或抵消谐波); ②多脉波整流(12脉波、24脉波, 减少特征谐波); ③PWM逆变(消除低次谐波); ④功率因数校正(PFC)技术。'},
  steps:['滤波器。','多脉波。','PWM。']},
 ca1315:{t:'ca13',g:2,tier:1,name:'对称性判断',card:'奇偶半波对称',
  gen(){const o=mcOf('根据波形对称性判断含哪些谐波',['不能判断','只含基波','只含直流']);return{q:'波形对称性分析的作用是?',mc:o.mc,ans:o.ans}},
  h1:'判断谐波成分。',h2:'简化计算。',
  sol(){return '对称性判断: ①偶函数f(t)=f(-t): 只含余弦项(an); ②奇函数f(t)=-f(-t): 只含正弦项(bn); ③半波对称f(t)=-f(t+T/2): 只含奇次谐波。可简化傅里叶系数计算。'},
  steps:['奇偶对称。','半波对称。','简化计算。']},
 ca1316:{t:'ca13',g:2,tier:1,name:'方波谐波',card:'只含奇次正弦',
  gen(){const o=mcOf('方波只含奇次正弦谐波(1,3,5,...)',['含所有谐波','只含偶次','只含直流']);return{q:'理想方波的谐波成分是?',mc:o.mc,ans:o.ans}},
  h1:'奇次正弦。',h2:'1,3,5,...',
  sol(){return '方波谐波: 理想方波是奇函数+半波对称, 只含奇次正弦谐波。f(t)=4Em/π·(sinωt+1/3sin3ωt+1/5sin5ωt+...)。幅值与n成反比, 高次谐波幅值小。'},
  steps:['奇函数。','奇次谐波。','1/n衰减。']},
 ca1317:{t:'ca13',g:2,tier:1,name:'三角波谐波',card:'只含奇次, 衰减更快',
  gen(){const o=mcOf('三角波只含奇次谐波, 幅值与n²成反比',['含所有谐波','只含偶次','只含直流']);return{q:'三角波的谐波特点是?',mc:o.mc,ans:o.ans}},
  h1:'奇次, 1/n²衰减。',h2:'衰减快。',
  sol(){return '三角波谐波: 奇函数+半波对称, 只含奇次正弦谐波。f(t)=8Em/π²·(sinωt-1/9sin3ωt+1/25sin5ωt-...)。幅值与n²成反比, 比衰减比方波更快, 高次谐波更小。'},
  steps:['奇次。','1/n²衰减。','衰减快。']},
 ca1318:{t:'ca13',g:2,tier:1,name:'全波整流谐波',card:'含偶次, 无奇次',
  gen(){const o=mcOf('全波整流波形含直流和偶次谐波, 无奇次',['只含基波','只含奇次','只含直流']);return{q:'全波整流波形的谐波成分是?',mc:o.mc,ans:o.ans}},
  h1:'直流+偶次。',h2:'无奇次。',
  sol(){return '全波整流谐波: 半波对称(周期为原信号一半), 只含偶次谐波(包括直流)。f(t)=2Em/π·(1+2/3cos2ωt-2/15cos4ωt+...)。主要成分是直流和2次谐波。'},
  steps:['半波对称。','偶次谐波。','直流+2次。']},
 ca1319:{t:'ca13',g:2,tier:1,name:'非正弦电路应用',card:'电力电子通信',
  gen(){const o=mcOf('整流器、逆变器、开关电源、通信信号',['纯电阻电路','直流电路','正弦电路']);return{q:'非正弦周期电路的典型应用是?',mc:o.mc,ans:o.ans}},
  h1:'电力电子。',h2:'通信信号。',
  sol(){return '非正弦应用: 整流器(交流→直流)、逆变器(直流→交流)、开关电源(SMPS)、PWM变频驱动、数字通信信号(方波、脉冲)、音频信号(含谐波)等。'},
  steps:['整流逆变。','开关电源。','通信信号。']},
 ca1320:{t:'ca13',g:2,tier:1,name:'非正弦谐振',card:'特定谐波谐振',
  gen(){const o=mcOf('电路可能对某次谐波发生谐振, 放大该谐波',['不能谐振','只对基波谐振','对所有频率谐振']);return{q:'非正弦电路中的谐振现象是?',mc:o.mc,ans:o.ans}},
  h1:'特定谐波谐振。',h2:'放大该谐波。',
  sol(){return '非正弦谐振: 当电路对某次谐波(n次)满足谐振条件(nωL=1/(nωC))时, 该次谐波被大幅放大, 造成波形严重畸变。可能引起过电压、设备损坏。需避免。'},
  steps:['nωL=1/(nωC)。','放大谐波。','波形畸变。']},
 ca1321:{t:'ca13',g:2,tier:1,name:'非正弦功率测量',card:'需测各次谐波',
  gen(){const o=mcOf('需分别测量各次谐波的功率后叠加',['只测基波','只测直流','不能测量']);return{q:'非正弦电路功率测量的特点是?',mc:o.mc,ans:o.ans}},
  h1:'测各次叠加。',h2:'频谱分析。',
  sol(){return '非正弦功率测量: 传统功率表只测基波有功。非正弦电路需用频谱分析仪或数字功率计, 分别测量各次谐波的电压、电流和相位, 计算各次功率后叠加。'},
  steps:['频谱分析。','各次谐波。','叠加。']},
 ca1322:{t:'ca13',g:2,tier:1,name:'非正弦阻抗',card:'不同频率阻抗不同',
  gen(){const o=mcOf('同一电路对不同频率谐波的阻抗不同',['阻抗相同','阻抗为零','阻抗无穷大']);return{q:'非正弦电路中阻抗的特点是?',mc:o.mc,ans:o.ans}},
  h1:'频率相关。',h2:'Z(nω)不同。',
  sol(){return '非正弦阻抗: 电感ZL=jnωL, 电容ZC=1/(jnωC), 对不同频率nω的阻抗不同。这是谐波分析法的基础: 对各次谐波分别计算阻抗, 用相量法求响应。'},
  steps:['Z(nω)。','频率相关。','分别计算。']},
 ca1323:{t:'ca13',g:2,tier:1,name:'非正弦电路能量守恒',card:'各次谐波功率守恒',
  gen(){const o=mcOf('各次谐波的有功功率分别守恒',['总功率守恒','只有基波守恒','不守恒']);return{q:'非正弦电路的能量守恒表现为?',mc:o.mc,ans:o.ans}},
  h1:'各次谐波分别守恒。',h2:'不同频率不耦合。',
  sol(){return '非正弦能量守恒: 各次谐波的有功功率分别守恒(电源发出的n次谐波有功=负载消耗的n次谐波有功)。不同频率的电压电流不产生平均功率, 不耦合。'},
  steps:['各次分别守恒。','不同频率不耦合。','功率叠加。']},
 ca1324:{t:'ca13',g:2,tier:1,name:'非正弦电路分析步骤',card:'分解→分别算→叠加',
  gen(){const o=mcOf('傅里叶分解→对各次谐波用相量法→时域叠加',['直接相量法','只算基波','只算直流']);return{q:'非正弦周期电路的分析步骤是?',mc:o.mc,ans:o.ans}},
  h1:'分解。',h2:'分别算。',h3:'叠加。',
  sol(){return '非正弦分析步骤: ①将非正弦信号傅里叶分解为直流+各次谐波; ②对各次谐波分别用相量法计算响应(注意阻抗随频率变化); ③将各次响应在时域叠加(不能相量叠加, 因为频率不同)。'},
  steps:['傅里叶分解。','分别相量法。','时域叠加。']},
 ca1325:{t:'ca13',g:2,tier:1,name:'非正弦电路应用实例',card:'整流滤波',
  gen(){const o=mcOf('整流器输出含谐波, 需滤波得到平滑直流',['纯正弦输出','无谐波','直流无纹波']);return{q:'非正弦电路分析的典型应用实例是?',mc:o.mc,ans:o.ans}},
  h1:'整流滤波。',h2:'谐波分析。',
  sol(){return '非正弦应用实例: 整流器输出含谐波(脉动直流), 用电感电容滤波抑制谐波得到平滑直流; 逆变器输出PWM波含高次谐波, 用滤波器提取基波; 通信信号含谐波, 用滤波器提取所需频段。'},
  steps:['整流滤波。','逆变器。','通信滤波。']},
 /* ===== ca14 电路方程的矩阵形式(25题) ===== */
 ca1401:{t:'ca14',g:2,tier:1,name:'图论基础',card:'节点支路',
  gen(){const o=mcOf('电路用节点和支路构成的图来描述',['只有节点','只有支路','只有回路']);return{q:'电路方程矩阵形式的图论基础是?',mc:o.mc,ans:o.ans}},
  h1:'节点+支路。',h2:'图论描述。',
  sol(){return '图论基础: 电路拓扑用图G=(N,B)描述, N是节点集合, B是支路集合。支路连接节点, 形成电路结构。图论概念: 路径、回路、树、割集等, 用于建立系统化的电路方程。'},
  steps:['节点。','支路。','图论。']},
 ca1402:{t:'ca14',g:2,tier:1,name:'关联矩阵A',card:'描述节点与支路关联',
  gen(){const o=mcOf('A描述节点与支路的关联关系, 元素为1、-1、0',['描述支路与回路','描述节点电压','描述支路电流']);return{q:'关联矩阵A的作用是?',mc:o.mc,ans:o.ans}},
  h1:'节点-支路关联。',h2:'1、-1、0。',
  sol(){return '关联矩阵A: (n-1)×b矩阵, 描述节点与支路的关联关系。元素aij: 支路j离开节点i为1, 进入节点i为-1, 不关联为0。KCL矩阵形式: A·i=0。'},
  steps:['A矩阵。','KCL: A·i=0。','节点-支路。']},
 ca1403:{t:'ca14',g:2,tier:1,name:'KCL矩阵形式',card:'A·i=0',
  gen(){const o=mcOf('A·i=0, A是关联矩阵, i是支路电流向量',['G·u=i','Z·i=u','A·u=0']);return{q:'KCL的矩阵形式是?',mc:o.mc,ans:o.ans}},
  h1:'A·i=0。',h2:'关联矩阵。',
  sol(){return 'KCL矩阵形式: A·i=0, 其中A是(n-1)×b关联矩阵, i是b×1支路电流向量。表示每个节点的电流代数和为零(流入=流出)。是节点分析法的基础。'},
  steps:['A·i=0。','节点KCL。','电流平衡。']},
 ca1404:{t:'ca14',g:2,tier:1,name:'KVL矩阵形式',card:'A^T·un=ub',
  gen(){const o=mcOf('ub=A^T·un, ub是支路电压, un是节点电压',['A·i=0','G·u=i','Z·i=u']);return{q:'KVL的矩阵形式是?',mc:o.mc,ans:o.ans}},
  h1:'ub=A^T·un。',h2:'支路电压=节点电压差。',
  sol(){return 'KVL矩阵形式: ub=A^T·un, 其中A^T是A的转置, un是(n-1)×1节点电压向量, ub是b×1支路电压向量。表示每条支路电压等于相关节点电压之差。'},
  steps:['ub=A^T·un。','支路电压。','节点电压差。']},
 ca1405:{t:'ca14',g:2,tier:1,name:'节点电压方程',card:'Yn·Un=In',
  gen(){const o=mcOf('Yn·Un=In, Yn=A·Y·A^T',['Zn·In=Un','Gn·Un=In','Yn=A^T·Y·A']);return{q:'节点电压方程的矩阵形式是?',mc:o.mc,ans:o.ans}},
  h1:'Yn·Un=In。',h2:'Yn=A·Y·A^T。',
  sol(){return '节点电压方程: Yn·Un=In, 其中Yn=A·Y·A^T是n-1阶节点导纳矩阵, Un是节点电压向量, In=A·Y·Us-Is是注入节点的等效电流源向量。Y是支路导纳矩阵。'},
  steps:['Yn·Un=In。','Yn=A·Y·A^T。','系统化方法。']},
 ca1406:{t:'ca14',g:2,tier:1,name:'回路电流方程',card:'Zl·Il=Ul',
  gen(){const o=mcOf('Zl·Il=Ul, Zl=B·Z·B^T',['Yl·Ul=Il','Gl·Ul=Il','Zl=B^T·Z·B']);return{q:'回路电流方程的矩阵形式是?',mc:o.mc,ans:o.ans}},
  h1:'Zl·Il=Ul。',h2:'Zl=B·Z·B^T。',
  sol(){return '回路电流方程: Zl·Il=Ul, 其中Zl=B·Z·B^T是独立回路阻抗矩阵, B是基本回路矩阵, Il是回路电流向量, Ul是回路中的等效电压源向量。用于回路分析法。'},
  steps:['Zl·Il=Ul。','Zl=B·Z·B^T。','回路分析。']},
 ca1407:{t:'ca14',g:2,tier:1,name:'割集电压方程',card:'Yq·Uq=Iq',
  gen(){const o=mcOf('Yq·Uq=Iq, 用割集矩阵描述',['Zq·Iq=Uq','Gq·Uq=Iq','Yq=Q·Y·Q^T']);return{q:'割集电压方程的矩阵形式是?',mc:o.mc,ans:o.ans}},
  h1:'Yq·Uq=Iq。',h2:'割集矩阵。',
  sol(){return '割集电压方程: Yq·Uq=Iq, 其中Yq=Q·Y·Q^T是割集导纳矩阵, Q是基本割集矩阵, Uq是割集电压向量, Iq是割集中的等效电流源向量。是节点法的推广。'},
  steps:['Yq·Uq=Iq。','割集矩阵。','节点法推广。']},
 ca1408:{t:'ca14',g:2,tier:1,name:'树与树支',card:'连通全部节点的最少支路',
  gen(){const o=mcOf('连通图的所有节点且不形成回路的最少支路集合',['任意支路集合','包含所有支路','形成回路的支路']);return{q:'树的定义是?',mc:o.mc,ans:o.ans}},

  sol(){return '树: 连通图G的一个子图, 包含G的所有节点, 连通但不形成任何回路。树的支路称为树支, 数目=n-1(n是节点数)。不在树中的支路称为连支。'},
  steps:['连通。','无回路。','n-1树支。']},
 ca1409:{t:'ca14',g:2,tier:1,name:'连支',card:'不在树中的支路',
  gen(){const o=mcOf('不在树中的支路, 数目=b-(n-1)',['树中的支路','所有支路','节点']);return{q:'连支的定义是?',mc:o.mc,ans:o.ans}},
  h1:'不在树中。',h2:'b-n+1条。',
  sol(){return '连支: 不在树中的支路。数目=b-(n-1)=b-n+1(b是总支路数, n是节点数)。每条连支与树支构成一个基本回路。连支电流可作为独立变量。'},
  steps:['不在树中。','b-n+1条。','基本回路。']},
 ca1410:{t:'ca14',g:2,tier:1,name:'基本回路',card:'一条连支+树支构成',
  gen(){const o=mcOf('由一条连支和相关树支构成的唯一回路',['任意回路','包含所有支路','只有树支']);return{q:'基本回路的定义是?',mc:o.mc,ans:o.ans}},
  h1:'一连支+树支。',h2:'唯一回路。',
  sol(){return '基本回路: 由一条连支和相关树支构成的唯一回路。基本回路数=连支数=b-n+1。基本回路矩阵B是独立回路矩阵, 用于建立回路电流方程。'},
  steps:['一连支。','树支构成。','b-n+1个。']},
 ca1411:{t:'ca14',g:2,tier:1,name:'基本割集',card:'一条树支+连支构成',
  gen(){const o=mcOf('由一条树支和相关连支构成的最小割集',['任意割集','包含所有支路','只有连支']);return{q:'基本割集的定义是?',mc:o.mc,ans:o.ans}},
  h1:'一树支+连支。',h2:'最小割集。',
  sol(){return '基本割集: 由一条树支和相关连支构成的最小割集(移除这些支路使图分成两部分)。基本割集数=树支数=n-1。基本割集矩阵Q用于建立割集电压方程。'},
  steps:['一树支。','连支构成。','n-1个。']},
 ca1412:{t:'ca14',g:2,tier:1,name:'节点法系统化',card:'Yn=A·Y·A^T',
  gen(){const o=mcOf('用关联矩阵A和支路导纳Y系统化建立节点方程',['手动列KCL','只适用于简单电路','不能用于计算机']);return{q:'节点分析系统化的关键是?',mc:o.mc,ans:o.ans}},
  h1:'Yn=A·Y·A^T。',h2:'计算机辅助。',
  sol(){return '节点法系统化: 用关联矩阵A和支路导纳矩阵Y, 直接计算节点导纳矩阵Yn=A·Y·A^T, 然后解Yn·Un=In。便于计算机自动建立方程, 是电路CAD的基础。'},
  steps:['A·Y·A^T。','计算机辅助。','CAD基础。']},
 ca1413:{t:'ca14',g:2,tier:1,name:'回路法系统化',card:'Zl=B·Z·B^T',
  gen(){const o=mcOf('用回路矩阵B和支路阻抗Z系统化建立回路方程',['手动列KVL','只适用于简单电路','不能用于计算机']);return{q:'回路分析系统化的关键是?',mc:o.mc,ans:o.ans}},
  h1:'Zl=B·Z·B^T。',h2:'计算机辅助。',
  sol(){return '回路法系统化: 用基本回路矩阵B和支路阻抗矩阵Z, 直接计算回路阻抗矩阵Zl=B·Z·B^T, 然后解Zl·Il=Ul。便于计算机自动建立方程, 但需先选树。'},
  steps:['B·Z·B^T。','计算机辅助。','需选树。']},
 ca1414:{t:'ca14',g:2,tier:1,name:'支路导纳矩阵Y',card:'对角矩阵',
  gen(){const o=mcOf('对角矩阵, 元素为各支路导纳',['非对角','元素为阻抗','元素为电流']);return{q:'支路导纳矩阵Y的特点是?',mc:o.mc,ans:o.ans}},

 ca1415:{t:'ca14',g:2,tier:1,name:'支路阻抗矩阵Z',card:'对角矩阵',
  gen(){const o=mcOf('对角矩阵, 元素为各支路阻抗',['非对角','元素为导纳','元素为电压']);return{q:'支路阻抗矩阵Z的特点是?',mc:o.mc,ans:o.ans}},
  h1:'对角矩阵。',h2:'各支路阻抗。',
  sol(){return '支路阻抗矩阵Z: b×b对角矩阵, 对角元素zk是第k条支路的阻抗(无耦合时)。有互感时非对角。用于计算回路阻抗矩阵Zl=B·Z·B^T。'},
  steps:['对角矩阵。','zk。','无耦合。']},
 ca1416:{t:'ca14',g:2,tier:1,name:'含受控源处理',card:'修改Y或Z矩阵',
